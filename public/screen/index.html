<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameShow — Pantalla</title>
<link rel="stylesheet" href="/shared/gameshow-transitions.css">
<link rel="stylesheet" href="/shared/roulette-panel.css">
<link rel="stylesheet" href="/shared/pictionary-board.css">
<style>
/* ═══════════════ RESET & BASE ═══════════════ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #0a0a1a; --surface: #12122a; --border: #1e1e3a;
    --cyan: #00d4ff; --gold: #fbbf24; --danger: #ef4444; --green: #22c55e;
    --text: #f0f0f0; --text2: #8888aa;
    --glow-cyan: 0 0 20px rgba(0,212,255,.4), 0 0 60px rgba(0,212,255,.15);
    --glow-gold: 0 0 20px rgba(251,191,36,.4), 0 0 60px rgba(251,191,36,.15);
}
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

/* ═══════════════ LAYOUT ═══════════════ */
#app { width: 100%; height: 100%; position: relative; }

.phase { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    opacity: 0; pointer-events: none; z-index: 1;
    transition: opacity 1s ease-in-out; }
.phase.active { opacity: 1; pointer-events: auto; z-index: 2; }

/* ═══════════════ LOBBY / WAITING ═══════════════ */
#phase-lobby { background: transparent; }
/* Nombre del juego en blanco con un borde suave en los colores del juego (principal pegado a la
   letra, secundario como halo) y una sombra oscura para que se lea sobre fondos claros */
.lobby-title { font-size: clamp(18px, min(4vw, 6.5vh), 52px); font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: #fff; text-align: center; padding: 0 4vw;
    text-shadow: 0 0 2px var(--cyan), 0 0 3px var(--cyan), 0 0 6px var(--cyan), 0 0 22px var(--gold), 0 3px 12px rgba(0,0,0,.45); }
.lobby-sub { font-size: clamp(14px, min(2vw, 3.4vh), 26px); color: #fff; margin-top: 14px; text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: fade-blink 2s ease-in-out infinite; }
@keyframes fade-blink { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

/* ═══════════════ ROUND INTRO ═══════════════ */
#phase-round-intro { background: transparent; }

/* ═══════════════ TIMER BAR (top) ═══════════════ */
.timer-strip { position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 50; background: var(--surface); }
.timer-strip-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width .3s linear; border-radius: 0 4px 4px 0; }
.timer-strip-fill.danger { background: linear-gradient(90deg, var(--danger), #ff6b6b); animation: timer-flash .5s infinite; }
@keyframes timer-flash { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

.timer-big { position: absolute; top: 20px; right: 40px; font-size: clamp(36px, 5vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--cyan); z-index: 51; text-shadow: 0 0 20px #00d4ff, 0 2px 4px rgba(0,0,0,.8); }
.timer-big.danger { color: var(--danger); text-shadow: 0 0 20px rgba(239,68,68,.5); }

/* ═══════════════ ROUND LABEL ═══════════════ */
.round-label { display: none; }

/* ═══════════════ QUESTION PHASE ═══════════════ */
/* Three-zone layout: header (logo+timer ~12vh), content (flex:1 centered), footer margin (~5vh) */
#phase-question { position: absolute; inset: 0; height: 100vh;
    padding: clamp(100px, 14vh, 160px) clamp(1rem, 3vw, 3rem) clamp(3vh, 5vh, 6vh);
    display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 2vh, 24px); box-sizing: border-box; }
.q-statement { flex-shrink: 0; max-height: 28vh; overflow: hidden;
    font-size: clamp(1.4rem, 2.8vw, 2.4rem); font-weight: 700; text-align: center; line-height: 1.4;
    width: 100%; margin: 0 auto;
    padding: clamp(16px, 2vh, 28px) clamp(20px, 3vw, 40px);
    background: rgba(0,0,0,.60); border-radius: 16px; color: #fff; backdrop-filter: blur(6px); }
.q-media { max-width: min(500px, 50vw); max-height: 20vh; border-radius: 16px; margin: 10px auto 0; box-shadow: var(--glow-cyan); object-fit: contain; flex-shrink: 0; }

/* Options grid for multirespuesta — 2×2, fills remaining space */
.q-options { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto;
    gap: clamp(10px, 1.5vh, 20px); padding: clamp(10px, 2vh, 24px) 0;
    width: 100%; margin: 0 auto; align-content: center; }
.q-opt { height: auto; min-height: 56px; display: flex; align-items: center; gap: 16px;
    font-size: clamp(1.1rem, 2vw, 1.9rem); font-weight: 600; line-height: 1.3; overflow: hidden;
    padding: clamp(14px, 2vh, 28px) clamp(16px, 2vw, 32px);
    background: rgba(0,0,0,.60); border: 2px solid rgba(255,255,255,.15); border-radius: 16px;
    color: #fff; backdrop-filter: blur(6px); transition: all 1s ease-in-out; }
.q-opt .opt-letter { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex;
    align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: var(--cyan); flex-shrink: 0; }

/* Correct/wrong reveal states — in-place on q-opt */
.q-opt.correct { border-color: var(--green); background: linear-gradient(rgba(34,197,94,.30),rgba(34,197,94,.30)),rgba(0,0,0,.60); box-shadow: 0 0 20px rgba(34,197,94,.3); }
.q-opt.correct .opt-letter { background: var(--green); color: #fff; }
.q-opt.dimmed { opacity: 0.3; }

/* Adaptive grid for 2, 3, 5+ options */
.q-options.cols-1 { grid-template-columns: 1fr; }
.q-options.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

/* Buzzer queue */
.buzzer-queue { margin-top: 40px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
.buzzer-chip { background: var(--surface); border: 2px solid var(--gold); border-radius: 40px; padding: 12px 28px;
    font-size: 24px; font-weight: 700; color: var(--gold); animation: chip-in .3s ease; }
.buzzer-chip:first-child { background: linear-gradient(135deg, #78350f, #a16207); border-color: var(--gold);
    color: #fff; font-size: 28px; box-shadow: var(--glow-gold); }
@keyframes chip-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Precio justo */
.precio-screen { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2vh, 24px); width: 100%; flex-shrink: 1; min-height: 0; }
.precio-screen-img { max-width: min(500px, 55vw); max-height: 28vh; border-radius: 16px; border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 8px 40px rgba(0,0,0,.5); object-fit: contain; flex-shrink: 1; }
.precio-screen-value { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 800; color: rgba(255,255,255,.55); text-align: center;
    padding: 12px 40px; border-radius: 16px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); flex-shrink: 0; }
.price-answers { display: flex; gap: clamp(10px, 2vh, 24px); flex-wrap: wrap; justify-content: center; flex-shrink: 1; min-height: 0; }
.price-chip { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 16px 28px;
    font-size: 22px; font-weight: 600; text-align: center; min-width: 160px; }
.price-chip .team-name { color: var(--text2); font-size: 16px; margin-bottom: 4px; }
.price-chip .team-value { color: var(--cyan); font-size: 32px; font-weight: 800; }

/* Boom ordering */
.boom-items { display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 16px); width: 100%; }
.boom-items .boom-item { background: rgba(0,0,0,.60); border: 2px solid rgba(255,255,255,.15); border-radius: 16px;
    padding: clamp(12px, 1.8vh, 24px) clamp(16px, 2vw, 32px);
    font-size: clamp(1.1rem, 2vw, 1.9rem); font-weight: 600; display: flex; align-items: center; gap: 16px;
    color: #fff; backdrop-filter: blur(6px); transition: all .4s ease; }
.boom-items .boom-item .boom-num { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); color: var(--cyan);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0; }
.boom-items .boom-item.correct { border-color: var(--green); background: linear-gradient(rgba(34,197,94,.30),rgba(34,197,94,.30)),rgba(0,0,0,.60); box-shadow: 0 0 20px rgba(34,197,94,.3); }
.boom-items .boom-item.correct .boom-num { background: var(--green); color: #fff; }
.boom-items .boom-item.pending { opacity: .45; justify-content: flex-start; color: var(--text2, #9aa); }
.boom-items .boom-arrow.pending { opacity: .3; }
.boom-items .boom-item.just { animation: boomStepIn .5s ease; }
@keyframes boomStepIn { 0% { transform: scale(.92); opacity: .3; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
.boom-items .boom-arrow { text-align: center; font-size: 24px; color: var(--green); line-height: 1; }

/* ═══════════════ ANSWER REVEALED ═══════════════ */
#phase-revealed { position: absolute; inset: 0; height: 100vh;
    padding: clamp(100px, 14vh, 160px) clamp(1rem, 3vw, 3rem) clamp(3vh, 5vh, 6vh);
    display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 2vh, 24px); box-sizing: border-box; background: transparent; }
.revealed-label { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 4px;
    color: #fff; text-shadow: 0 0 10px rgba(255,255,255,.3); flex-shrink: 0; text-align: center; margin-bottom: 8px; }
.revealed-answer { flex-shrink: 0; max-height: 28vh; overflow: hidden;
    font-size: clamp(1.4rem, 2.8vw, 2.4rem); font-weight: 800; text-align: center; line-height: 1.4;
    width: 88%; margin: 0 auto;
    padding: clamp(16px, 2vh, 28px) clamp(20px, 3vw, 40px);
    background: linear-gradient(rgba(34,197,94,.30),rgba(34,197,94,.30)),rgba(0,0,0,.60);
    border: 2px solid var(--green); box-shadow: 0 0 20px rgba(34,197,94,.3);
    border-radius: 16px; color: #fff; backdrop-filter: blur(6px);
    animation: reveal-pop .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes reveal-pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }

/* Options with correct/wrong highlighting — same 2×2 layout */
.revealed-options { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: clamp(10px, 1.5vh, 20px); padding: clamp(10px, 2vh, 24px) 0;
    width: 88%; margin: 0 auto; }
.rev-opt { height: 100%; min-height: 56px; display: flex; align-items: center; gap: 16px;
    font-size: clamp(1rem, 1.9vw, 1.7rem); font-weight: 600; line-height: 1.3; overflow: hidden;
    padding: clamp(8px, 1.2vh, 16px) clamp(12px, 2vw, 24px);
    background: rgba(0,0,0,.60); border: 2px solid rgba(255,255,255,.15); border-radius: 16px;
    color: #fff; backdrop-filter: blur(6px); transition: all 1s ease-in-out; }
.rev-opt.correct { border-color: var(--green); background: rgba(34,197,94,.25); }
.rev-opt .opt-letter { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); display: flex;
    align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: var(--cyan); flex-shrink: 0; }
.rev-opt.correct .opt-letter { background: var(--green); color: #fff; }

/* ═══════════════ SCOREBOARD (full-phase + overlay) ═══════════════ */
#phase-scoreboard { padding: 60px; background: radial-gradient(ellipse at center, #1a1a2e 0%, var(--bg) 70%); }
.sb-title { font-size: 42px; font-weight: 800; text-transform: uppercase; letter-spacing: 4px;
    color: var(--gold); margin-bottom: 40px; text-shadow: var(--glow-gold); }
.sb-table { width: 100%; max-width: 900px; }
.sb-row { display: flex; align-items: center; padding: 16px 24px; border-radius: 14px; margin-bottom: 14px;
    background: rgba(18,18,42,.85); border: 1px solid rgba(255,255,255,.06); transition: all .4s ease;
    animation: sb-slide-in .5s ease backwards; backdrop-filter: blur(8px);
    box-shadow: 0 0 12px 3px rgba(0,212,255,.15), 0 0 24px 6px rgba(0,212,255,.06); }
.sb-row:nth-child(1) { background: linear-gradient(135deg, rgba(251,191,36,.18), rgba(251,191,36,.06));
    border-color: rgba(251,191,36,.2);
    box-shadow: 0 0 15px 4px rgba(255,200,0,.4), 0 0 30px 8px rgba(0,212,255,.15); }
.sb-row:nth-child(1) .sb-pos { background: var(--gold); color: var(--bg); }
.sb-row:nth-child(2) { animation-delay: .1s; }
.sb-row:nth-child(3) { animation-delay: .2s; }
.sb-row:nth-child(4) { animation-delay: .3s; }
.sb-row:nth-child(5) { animation-delay: .35s; }
.sb-row:nth-child(6) { animation-delay: .4s; }
@keyframes sb-slide-in { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
.sb-pos { width: 48px; height: 48px; border-radius: 50%; background: var(--border); display: flex;
    align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: var(--cyan); flex-shrink: 0; }
.sb-photo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--border); margin-left: 12px; }
.sb-name { flex: 1; font-size: 28px; font-weight: 700; margin-left: 20px; }
.sb-score { font-size: 36px; font-weight: 800; color: var(--cyan); font-variant-numeric: tabular-nums; text-shadow: var(--glow-cyan); }
.sb-bar { flex: 0 0 200px; height: 12px; background: var(--border); border-radius: 6px; margin: 0 24px; overflow: hidden; }
.sb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); border-radius: 6px; transition: width .6s ease; }

/* Scoreboard overlay (global, z-index above everything) */
#scoreboardOverlay { z-index: 80; }
#scoreboardOverlay .sb-overlay-inner { width: 90%; max-width: 980px; max-height: 86vh; overflow-y: hidden; box-sizing: border-box; padding: 36px 44px; }

/* QR overlay */
.gs-qr-overlay { position: fixed; inset: 0; z-index: 85; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .4s ease; display: flex; align-items: center; justify-content: center; }
.gs-qr-overlay.active { opacity: 1; pointer-events: auto; }
.gs-qr-card { background: #fff; border-radius: 28px; padding: 40px; box-shadow: 0 8px 60px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.gs-qr-card #qrCanvas { display: flex; align-items: center; justify-content: center; }

/* Premio overlay (shared structure: bg-layer + filter + content) */
.gs-premio-overlay { position: fixed; inset: 0; z-index: 86; opacity: 0; pointer-events: none; transition: opacity .4s ease; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.gs-premio-overlay.active { opacity: 1; pointer-events: auto; }

/* Bono usage notification banner */
.gs-bono-aviso { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 90; background: rgba(40,40,50,.85); border-radius: 14px; padding: 18px 48px; color: #fff; font-size: 28px; font-weight: 700; text-transform: uppercase; text-align: center; letter-spacing: 1px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .4s ease; text-shadow: 0 2px 6px rgba(0,0,0,.6); backdrop-filter: blur(6px); }
.gs-bono-aviso.active { opacity: 1; }
.gs-premio-bg-layer {
    position: absolute; inset: 0;
    filter: blur(18px);
    background: var(--bg, #0a0a1a);
    background-size: cover; background-position: center;
    transform: scale(1.08);
}
.gs-premio-bg-layer.bg-gradient-anim { animation: bgShift 12s ease-in-out infinite; background-size: 300% 300%; }
.gs-premio-bg-layer.bg-image-cover { background-size: cover; background-position: center; }
.gs-premio-filter-layer { position: absolute; inset: 0; background: rgba(10,10,26,.88); }
.gs-premio-card { position: relative; z-index: 1; text-align: center; padding: 48px 64px; }
.gs-premio-title { font-size: clamp(36px, 5vw, 64px); font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,.6), 0 0 40px rgba(255,215,0,.3); margin-bottom: 24px; }
.gs-premio-bono { font-size: clamp(24px, 3vw, 42px); color: #fff; display: flex; align-items: center; justify-content: center; gap: 16px; }
.gs-premio-bono-icon { font-size: 1.4em; }
.gs-premio-puntos { font-size: clamp(28px,4vw,52px); font-weight: 900; color: #ffd700; margin-top: 16px; text-shadow: 0 0 20px rgba(255,215,0,.6), 0 0 40px rgba(255,215,0,.3); }
/* Premio de anuncio: imagen arriba y texto debajo, en columna centrada (vale con solo uno de los dos) */
.gs-premio-anuncio { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.5vh, 28px); margin-top: 20px; max-width: min(1100px, 88vw); margin-inline: auto; }
.gs-premio-anuncio img { max-width: min(70vw, 900px); max-height: 52vh; border-radius: 16px; display: block; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.gs-premio-anuncio-text { font-size: clamp(26px, 3.6vw, 48px); font-weight: 900; line-height: 1.2; color: #fff; text-align: center; overflow-wrap: anywhere; white-space: pre-line; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
.gs-premio-anuncio-text:empty { display: none; }
.gs-premio-anuncio.no-img .gs-premio-anuncio-text { font-size: clamp(30px, 4.4vw, 60px); color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,.5), 0 2px 12px rgba(0,0,0,.6); }
.gs-premio-card { max-width: 100vw; box-sizing: border-box; }

/* ═══════════════ WAITING ═══════════════ */
#phase-waiting { background: transparent; }
#phase-waiting .gs-waiting-logo { max-height: 58vh; max-width: 70vw; object-fit: contain; filter: drop-shadow(0 0 30px rgba(0,0,0,.5)); }

/* ═══════════════ PRE-COUNTDOWN DARK OVERLAY ═══════════════ */
.timer-overlay { position: fixed; inset: 0; z-index: 54; background: rgba(0,0,0,.80); pointer-events: none;
    opacity: 0; transition: opacity .6s ease; }
.timer-overlay.active { opacity: 1; }

/* ═══════════════ ROUND END ═══════════════ */
#phase-round-end { position: fixed; inset: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,.50); z-index: 60; }
.round-end-content { display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: round-end-in .8s cubic-bezier(.34,1.56,.64,1); }
.round-end-title { font-size: clamp(3rem, 8vw, 7rem); font-weight: 800; text-align: center; text-transform: uppercase;
    color: #fff; }
@keyframes round-end-in { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }

/* ═══════════════ PRE-COUNTDOWN ═══════════════ */
.pre-countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 55;
    font-size: clamp(120px, 20vw, 240px); font-weight: 800; color: #fff; text-shadow: 0 0 40px var(--cyan), 0 0 80px rgba(0,212,255,.4), 0 4px 8px rgba(0,0,0,.9);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.pre-countdown.active { opacity: 1; animation: countPop 1s ease-out; }
@keyframes countPop { 0% { transform: translate(-50%,-50%) scale(1.6); opacity: .5; } 30% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(.95); opacity: .8; } }

/* ═══════════════ NOTIFICATION TOAST ═══════════════ */
.notif { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: linear-gradient(135deg, #1e1e3a, #12122a); border: 2px solid var(--gold); border-radius: 16px;
    padding: 16px 36px; font-size: 24px; font-weight: 700; color: var(--gold); box-shadow: var(--glow-gold);
    opacity: 0; transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
.notif.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════ SCOREBOARD MINI — hidden during question/reveal ═══════════════ */
.mini-scores { display: none; }
.mini-chip { background: rgba(18,18,42,.85); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 16px; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(8px); }
.mini-chip .mc-name { color: var(--text2); }
.mini-chip .mc-score { color: var(--cyan); font-weight: 800; }
.mini-chip.first .mc-score { color: var(--gold); }

/* ═══════════════ IMAGE PUZZLE (Adivina la Imagen) ═══════════════ */
#imagenScreenWrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2%; overflow: hidden; }
#imagenScreenGrid { position: relative; display: grid; gap: 0; }
#imagenScreenGrid .img-tile { transition: opacity .4s ease; }
#imagenScreenGrid .img-tile.hidden { opacity: 0; }
#imagenFijaWrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px 2% 2% 2%; overflow: hidden; }
#imagenFijaWrap .if-logo { max-height: 100px; max-width: 300px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(0,0,0,.5)); margin-bottom: 10px; }
#imagenFijaWrap .if-img-zone { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
#imagenFijaWrap .if-img-zone img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,.5); }
#imagenFijaWrap .if-img-zone video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,.5); }
#imagenFijaWrap .if-video-tap { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 10px 24px; font-size: 16px; cursor: pointer; z-index: 5; backdrop-filter: blur(4px); }
#cancionScreenWrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px 2% 2% 2%; overflow: hidden; }
#cancionScreenWrap .cn-logo { max-height: 100px; max-width: 300px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(0,0,0,.5)); margin-bottom: 10px; }
#cancionScreenWrap .cn-img-zone { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
#cancionScreenWrap .cn-img-zone img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,.5); }
#imagenAnswerOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
#imagenAnswerOverlay .img-answer-card { width: 65%; max-width: 800px; text-align: center;
    padding: clamp(16px, 2vh, 28px) clamp(20px, 3vw, 40px);
    background: linear-gradient(rgba(34,197,94,.30),rgba(34,197,94,.30)),rgba(0,0,0,.60);
    border: 2px solid var(--green); box-shadow: 0 0 20px rgba(34,197,94,.3);
    border-radius: 16px; color: #fff; backdrop-filter: blur(6px);
    font-size: clamp(1.4rem, 2.8vw, 2.4rem); font-weight: 800; line-height: 1.4;
    opacity: 0; transition: opacity 1s ease; }
#imagenAnswerOverlay .img-answer-card.visible { opacity: 1; }
#phase-question.imagen-mode { padding: 0; }
/* Imagen que se aclara: la imagen ocupa la pantalla; la respuesta aparece abajo al revelar */
#aclaraScreenWrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2%; box-sizing: border-box; overflow: hidden; }
#aclaraCanvas { width: 100%; height: 100%; display: block; }
/* La cola del pulsador va encima de la imagen, arriba (Adivina la imagen, Imagen que se aclara,
   Imagen fija y Canción: en todas el contenido ocupa la pantalla y la tapaba) */
#phase-question.queue-over #buzzerQueue { position: absolute; top: 3%; left: 8px; right: 8px; z-index: 40; margin: 0; pointer-events: none; }
.aclara-answer { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 80%; padding: 16px 36px; border-radius: 18px; text-align: center;
    font-size: clamp(1.6rem, 3.4vw, 3.2rem); font-weight: 900; color: #fff; background: linear-gradient(rgba(34,197,94,.35),rgba(34,197,94,.35)), rgba(0,0,0,.7);
    border: 2px solid var(--green); box-shadow: 0 0 30px rgba(34,197,94,.35); opacity: 0; transition: opacity .5s; pointer-events: none; }
.aclara-answer.visible { opacity: 1; animation: reveal-pop .6s cubic-bezier(.34,1.56,.64,1); }

/* Pictionary: quién dibuja arriba, la pizarra en grande y la palabra abajo al revelar */
#picScreenWrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: stretch; padding: 2% 2% 2%; box-sizing: border-box; gap: 1.5vh; }
.pic-scr-head { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; min-height: 0; padding-right: 180px; padding-left: 180px; }
.pic-scr-who { font-size: clamp(1.4rem, 3vw, 2.6rem); font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6); display: flex; align-items: center; gap: 14px; }
.pic-scr-who img { width: clamp(44px, 6vh, 72px); height: clamp(44px, 6vh, 72px); border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); }
.pic-scr-who b { color: var(--gold); }
.pic-scr-cat { font-size: clamp(1rem, 1.8vw, 1.6rem); font-weight: 700; padding: 6px 18px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); color: #fff; }
.pic-scr-paused { font-size: clamp(1rem, 1.6vw, 1.4rem); font-weight: 800; color: #fde047; }
.pic-scr-board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.pic-scr-board .pic-canvas { border-radius: 14px; box-shadow: 0 0 0 4px rgba(255,255,255,.15), 0 10px 50px rgba(0,0,0,.6); }
.pic-scr-intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; text-align: center; padding: 4%; }
.pic-scr-intro .pi-icon { font-size: clamp(4rem, 12vh, 9rem); line-height: 1; filter: drop-shadow(0 0 20px rgba(250,204,21,.4)); }
.pic-scr-intro .pi-label { font-size: clamp(1.4rem, 3vw, 2.6rem); font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--text2, #a1a1aa); }
.pic-scr-intro .pi-team { font-size: clamp(2.6rem, 7vw, 6.5rem); font-weight: 900; color: var(--gold); text-shadow: 0 0 30px rgba(250,204,21,.45); line-height: 1.05; display: flex; align-items: center; gap: 3vw; }
.pic-scr-intro .pi-team img { width: clamp(80px, 14vh, 170px); height: clamp(80px, 14vh, 170px); border-radius: 50%; object-fit: cover; border: 5px solid var(--gold); }
.pic-scr-intro .pi-cat { font-size: clamp(1.2rem, 2.4vw, 2rem); font-weight: 700; padding: 8px 26px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); }
.pic-scr-word { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); max-width: 86%; padding: 14px 40px; border-radius: 18px; text-align: center;
    font-size: clamp(1.8rem, 4.4vw, 4rem); font-weight: 900; color: #fff; background: linear-gradient(rgba(34,197,94,.35),rgba(34,197,94,.35)), rgba(0,0,0,.75);
    border: 2px solid var(--green); box-shadow: 0 0 30px rgba(34,197,94,.35); pointer-events: none; animation: reveal-pop .6s cubic-bezier(.34,1.56,.64,1); }
.pic-scr-word small { display: block; font-size: .42em; font-weight: 700; letter-spacing: 2px; opacity: .9; margin-top: 4px; }
#phase-question.pic-mode { padding: 0; }
#phase-question.pic-mode #buzzerQueue { top: auto; bottom: 4%; }
html.embed #picScreenWrap { padding: 8px; gap: 6px; }
html.embed .pic-scr-head { padding-right: 0; padding-left: 0; }

/* ═══════════════ LETTER PANEL (RULETA) ═══════════════ */
.letter-panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 40px; max-width: 1000px; }
.letter-cell { width: 56px; height: 64px; background: var(--surface); border: 2px solid var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: var(--cyan);
    transition: all .3s ease; text-transform: uppercase; }
.letter-cell.hidden { color: transparent; background: linear-gradient(135deg, #1e1e3a, #12122a); border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,212,255,.2); }
.letter-cell.space { background: transparent; border-color: transparent; box-shadow: none; }
.letter-cell.revealed { animation: letter-flip .4s ease; }
@keyframes letter-flip { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }

/* ═══════════════ TEAM RESULTS OVERLAY ═══════════════ */
.team-results-overlay { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,26,.85); backdrop-filter: blur(10px);
    opacity: 0; transform: scale(.95); transition: opacity .5s ease, transform .5s ease; pointer-events: none; }
.team-results-overlay.active { opacity: 1; transform: scale(1); pointer-events: auto; }
.tr-container { width: 90%; max-width: 980px; max-height: 86vh; overflow-y: hidden; box-sizing: border-box; padding: 36px 44px; }
/* Listas largas en el proyector: sin barra de scroll; se desplazan solas (autoScrollLists) */
.tr-container, #scoreboardOverlay .sb-overlay-inner { scrollbar-width: none; }
.tr-container::-webkit-scrollbar, #scoreboardOverlay .sb-overlay-inner::-webkit-scrollbar { display: none; }
.tr-title { font-size: 32px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px;
    color: var(--cyan); margin-bottom: 30px; text-align: center; text-shadow: var(--glow-cyan); }
.tr-card { display: flex; align-items: center; gap: 20px; padding: 18px 28px; border-radius: 14px; margin-bottom: 12px;
    background: rgba(10,10,26,.85); backdrop-filter: blur(8px); border: 1px solid var(--border);
    animation: tr-slide-in .4s ease backwards; }
.tr-card:nth-child(2) { animation-delay: .05s; }
.tr-card:nth-child(3) { animation-delay: .1s; }
.tr-card:nth-child(4) { animation-delay: .15s; }
.tr-card:nth-child(5) { animation-delay: .2s; }
.tr-card:nth-child(6) { animation-delay: .25s; }
.tr-card:nth-child(7) { animation-delay: .3s; }
.tr-card:nth-child(8) { animation-delay: .35s; }
@keyframes tr-slide-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.tr-card .tr-icon { font-size: 36px; flex-shrink: 0; }
.tr-card .tr-photo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--border); }
.tr-card .tr-name { font-size: 26px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-card .tr-answer-text { font-size: 20px; color: var(--text2); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-card .tr-pts { font-size: 28px; font-weight: 800; width: 100px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.tr-card .tr-pts.positive { color: var(--green); text-shadow: 0 0 10px rgba(34,197,94,.3); }
.tr-card .tr-pts.negative { color: var(--danger); text-shadow: 0 0 10px rgba(239,68,68,.3); }
.tr-card .tr-pts.zero { color: var(--text2); }
.tr-card.correct { border-color: var(--green); background: linear-gradient(135deg, rgba(34,197,94,.08), transparent); }
.tr-card.wrong { border-color: var(--danger); background: linear-gradient(135deg, rgba(239,68,68,.05), transparent); opacity: .7; }
.tr-card.no-answer { opacity: .4; }

/* ═══════════════ MENU GRID (HOME/CATEGORY) ═══════════════ */
.screen-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 40px; transition: opacity .5s ease; }
.screen-menu.fade-out { opacity: 0; }
.screen-menu-logo { max-height: 240px; max-width: 540px; object-fit: contain; margin-bottom: 36px; filter: drop-shadow(0 4px 20px rgba(0,0,0,.6)); }
.screen-menu-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; max-width: 1000px; }
.screen-menu-item { background: none; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
    transition: all .4s ease; animation: menu-item-in .5s ease backwards; padding: 20px; }
.screen-menu-item img { max-width: 100%; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.5)); }
.screen-menu-item .smi-label { font-size: 20px; font-weight: 700; color: var(--text); text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.screen-menu-item .smi-sub { font-size: 14px; color: var(--text2); text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.screen-menu-item.completed { opacity: .35; }
/* Ajuste automático (fitScreenMenu): columnas y tamaño calculados para que quepan todas las casillas */
.screen-menu-grid.fit { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); gap: var(--gap); max-width: none; justify-content: center; }
.screen-menu-grid.fit .screen-menu-item { width: var(--cell) !important; height: var(--cell); padding: calc(var(--cell) * .06); }
.screen-menu-grid.fit .screen-menu-item img { max-height: calc(var(--cell) * .88) !important; max-width: 100%; }
.screen-menu-grid.fit .screen-menu-item > div { font-size: calc(var(--cell) * .3) !important; }
.screen-menu-item.completed .smi-label { text-decoration: line-through; color: var(--text2); }
@keyframes menu-item-in { from { opacity: 0; transform: translateY(30px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
.screen-menu-item:nth-child(1) { animation-delay: 0s; }
.screen-menu-item:nth-child(2) { animation-delay: .1s; }
.screen-menu-item:nth-child(3) { animation-delay: .15s; }
.screen-menu-item:nth-child(4) { animation-delay: .2s; }
.screen-menu-item:nth-child(5) { animation-delay: .25s; }
.screen-menu-item:nth-child(6) { animation-delay: .3s; }
/* Category logos: scale by count */
.screen-menu-grid.menu-categories[data-count="1"] .screen-menu-item img { max-height: 260px; }
.screen-menu-grid.menu-categories[data-count="2"] .screen-menu-item img { max-height: 220px; }
.screen-menu-grid.menu-categories[data-count="3"] .screen-menu-item img { max-height: 190px; }
.screen-menu-grid.menu-categories[data-count="4"] .screen-menu-item img { max-height: 160px; }
.screen-menu-grid.menu-categories[data-count="5"] .screen-menu-item img,
.screen-menu-grid.menu-categories[data-count="6"] .screen-menu-item img { max-height: 130px; }
/* Round logos: scale by count */
.screen-menu-grid.menu-rounds[data-count="1"] .screen-menu-item img { max-height: 200px; }
.screen-menu-grid.menu-rounds[data-count="2"] .screen-menu-item img { max-height: 170px; }
.screen-menu-grid.menu-rounds[data-count="3"] .screen-menu-item img { max-height: 140px; }
.screen-menu-grid.menu-rounds[data-count="4"] .screen-menu-item img { max-height: 120px; }
.screen-menu-grid.menu-rounds[data-count="5"] .screen-menu-item img,
.screen-menu-grid.menu-rounds[data-count="6"] .screen-menu-item img { max-height: 100px; }
/* Adaptive widths by count */
.screen-menu-grid[data-count="1"] .screen-menu-item { width: 320px; }
.screen-menu-grid[data-count="2"] .screen-menu-item { width: 280px; }
.screen-menu-grid[data-count="3"] .screen-menu-item { width: 240px; }
.screen-menu-grid[data-count="4"] .screen-menu-item { width: 220px; }
.screen-menu-grid[data-count="5"] .screen-menu-item,
.screen-menu-grid[data-count="6"] .screen-menu-item { width: 180px; }
/* Adaptive gap by count */
.screen-menu-grid[data-count="1"],
.screen-menu-grid[data-count="2"] { gap: 60px; }
.screen-menu-grid[data-count="3"] { gap: 50px; }
.screen-menu-grid[data-count="4"] { gap: 40px; }
.screen-menu-grid[data-count="5"],
.screen-menu-grid[data-count="6"] { gap: 30px; }

/* ═══════════════ PULSADOR SCREEN ═══════════════ */
.pulsador-screen-status { font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; text-transform: uppercase; letter-spacing: 4px; text-align: center; padding: 20px 60px; border-radius: 20px; }
.pulsador-screen-status.ps-open { color: #fff; background: rgba(34,197,94,.25); border: 2px solid var(--green); text-shadow: 0 0 30px rgba(34,197,94,.5); box-shadow: 0 0 40px rgba(34,197,94,.2); }
.pulsador-screen-status.ps-closed { color: #fff; background: rgba(239,68,68,.25); border: 2px solid var(--danger); text-shadow: 0 0 30px rgba(239,68,68,.5); box-shadow: 0 0 40px rgba(239,68,68,.2); }
.pulsador-screen-queue { display: flex; flex-direction: column; gap: clamp(10px, 1.5vh, 20px); margin-top: 40px; width: 80%; max-width: 700px; }
.psq-item { display: flex; align-items: center; gap: 20px; padding: clamp(14px, 2vh, 24px) clamp(20px, 3vw, 36px);
    background: rgba(0,0,0,.60); border: 2px solid rgba(255,255,255,.15); border-radius: 16px;
    backdrop-filter: blur(6px); animation: psq-in .4s ease backwards; }
.psq-item:first-child { border-color: var(--gold); background: linear-gradient(135deg, rgba(251,191,36,.15), rgba(0,0,0,.60)); box-shadow: var(--glow-gold); }
.psq-item:nth-child(1) { animation-delay: 0s; }
.psq-item:nth-child(2) { animation-delay: .08s; }
.psq-item:nth-child(3) { animation-delay: .12s; }
.psq-item:nth-child(4) { animation-delay: .16s; }
.psq-item:nth-child(5) { animation-delay: .2s; }
@keyframes psq-in { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
.psq-pos { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 800; color: var(--gold); min-width: 60px; text-align: center; }
.psq-item:first-child .psq-pos { font-size: clamp(2rem, 4vw, 3rem); }
.psq-photo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--surface); }
.psq-name { flex: 1; font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: 700; color: #fff; }
.psq-time { font-size: clamp(1rem, 2vw, 1.5rem); color: var(--cyan); font-weight: 600; font-variant-numeric: tabular-nums; }
.pulsador-screen-empty { font-size: clamp(1.2rem, 2.5vw, 1.8rem); color: var(--text2); text-align: center; margin-top: 60px; }

/* ═══════════════ CONNECTION STATUS ═══════════════ */
.conn-dot { position: fixed; bottom: 12px; right: 12px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--green); z-index: 200; display: none; transition: background .3s; }
.conn-dot.disconnected { display: block; background: var(--danger); animation: blink-dot 1s infinite; }
@keyframes blink-dot { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* Fullscreen button */
.fs-btn { position: fixed; bottom: 16px; right: 16px; z-index: 200; width: 48px; height: 48px; border-radius: 50%; background: rgba(18,18,42,.7); border: 1px solid var(--border); color: var(--text2); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: .2s; }
.fs-btn:hover { color: var(--cyan); border-color: var(--cyan); }
.fs-btn.hidden { display: none; }

/* ═══════════════ GAME LOGO ═══════════════ */
/* Espera inicial: logo grande y flotando, como en la espera entre rondas (gsFloat) */
.game-logo { max-height: 46vh; max-width: 70vw; object-fit: contain; margin-bottom: 3vh; filter: drop-shadow(0 0 20px rgba(0,0,0,.5)); animation: gsFloat 3s ease-in-out infinite; }
.round-logo { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); min-height: 120px; max-height: 140px; max-width: 400px; object-fit: contain; z-index: 52; filter: drop-shadow(0 0 10px rgba(0,0,0,.5)); }

/* ═══════════════ ANIMATED BACKGROUNDS ═══════════════ */
.bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: background-image .6s ease, background-color .6s ease, opacity .5s ease; }
.bg-gradient-anim { animation: bgShift 12s ease-in-out infinite; background-size: 300% 300%; }
@keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.bg-image-cover { background-size: cover; background-position: center; }

/* ═══════════════ PARTICLES ═══════════════ */
.particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
/* Vista incrustada en el iPad (modo sin pantalla): sin botón de pantalla completa ni QR de entrada */
html.embed #fsBtn, html.embed #qrOverlay, html.embed .conn-dot { display: none !important; }
/* Dentro del iPad el escenario no se amplía ni se desplaza con los dedos (doble toque de iOS) */
html.embed, html.embed * { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html.embed #imagenScreenWrap, html.embed #aclaraScreenWrap, html.embed #imagenFijaWrap, html.embed #cancionScreenWrap { padding: 12px; box-sizing: border-box; }
/* En un escenario estrecho (móvil en vertical) nada se sale por los lados: el logo de ronda tenía
   ancho y alto mínimos pensados para el proyector, y la cola del pulsador también */
html.embed .lobby-title { font-size: clamp(16px, min(6vw, 7vh), 52px); letter-spacing: 2px; text-align: center; max-width: 92vw; }
html.embed .round-logo { top: 8px; min-height: 0; max-height: min(140px, 18vh); max-width: min(400px, 80vw); }
html.embed .pulsador-screen-status { max-width: 100%; padding: 12px 20px; letter-spacing: 2px; }
html.embed .pulsador-screen-queue { width: 100%; margin-top: 16px; }
html.embed .psq-item { gap: 10px; padding: 10px 14px; }
html.embed .psq-pos { min-width: 0; }
html.embed .psq-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Ordenador que solo pone el sonido (juego sin pantalla): aviso discreto hasta el primer clic */
.sound-hint { position: fixed; left: 16px; bottom: 16px; z-index: 9999; padding: 10px 18px; border-radius: 999px; border: 2px solid #fff; background: rgba(0,0,0,.8); color: #fff; font: 700 18px system-ui, sans-serif; pointer-events: none; }
.particle { position: absolute; border-radius: 50%; opacity: 0; animation: particleFloat linear infinite; }
@keyframes particleFloat {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-10vh) scale(1); }
}

/* ═══════════════ IDENTIDAD (Emparejar) — SCREEN ═══════════════ */
#identidadScreenWrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 16px); }
.id-timer-band { flex-shrink: 0; width: 100%; display: flex; justify-content: flex-end; align-items: center; }
.id-timer { font-size: clamp(36px, 5vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--cyan); text-shadow: 0 0 20px #00d4ff, 0 2px 4px rgba(0,0,0,.8); }
.id-timer.danger { color: var(--danger); text-shadow: 0 0 20px rgba(239,68,68,.5); }
.id-content { flex: 1; min-height: 0; display: flex; gap: clamp(8px, 1.5vw, 24px); }

.karaoke-screen-fin { font-size: clamp(6rem, 14vw, 16rem); font-weight: 900; color: #fff; text-align: center; text-shadow: 0 0 4px #000, 0 6px 26px rgba(0,0,0,.7); line-height: 1; }

    // ha callado antes de mandarla (cut). Sin fondo, la sintonía usa su fundido de entrada.

var socket = null;

var prevOptionsRevealed = false;

var _premioStrings = {
    title: '¡PRUEBA CON BONO!',
    bonos: { freeze: 'Congelar a un rival', lock_all: 'Congelar a todos', puntos: 'Puntos extra', anuncio: 'Premio sorpresa' },
    icons: { freeze: '❄️', lock_all: '🔒', puntos: '➕', anuncio: '🎁' },
    ganadorPrefix: '¡BONO PARA ',
    ganadorSuffix: '!',

// ═══════════════ CONNECT ═══════════════
function connect() {
    if (!gameId) { document.getElementById('lobbyTitle').textContent = 'Sin juego'; return; }
    socket = io({ query: { gameId: gameId } });

    socket.on('connect', function() {
        document.getElementById('connDot').classList.remove('disconnected');
        socket.emit('screen:join', { embed: EMBED });
        GSnd.rejoined();
        if (_preloadSummary && !EMBED) socket.emit('screen:preload_status', _preloadSummary);
    });

    socket.on('disconnect', function() {
        document.getElementById('connDot').classList.add('disconnected');
    });

    socket.on('game:player_sync', onSync);
    socket.on('game:jingle', GSnd.jingle);
    socket.on('game:jingle_stop', GSnd.stop);
    socket.on('game:timer_tick', function(d) {
        if (ps) { ps.timer.remaining = d.remaining; ps.timer.total = d.total; }
        renderTimer();
    });
    socket.on('actualizar_pulsador_lista', function(cola) {
        if (ps) ps.colaPulsador = cola;
        renderBuzzerQueue();
    });
    socket.on('estado_pulsador_cambio', function(d) {
        if (ps) { ps.pulsadorActivo = d.activo; ps.colaPulsador = d.cola; }
        renderBuzzerQueue();
    });

        if (!ps) return;

            RoulettePanel.revealLetter(container, d.letter);
        }
    });
    socket.on('game:roulette_solved', function(d) {
        if (!ps) return;
        ps.rouletteSolved = true;
        var container = document.getElementById('ruletaScreenPanel');
        if (container && container.style.display !== 'none') {
            RoulettePanel.solveAll(container, d.phrase);
        }
    });
    socket.on('game:roulette_reset', function() {
        if (!ps) return;
        ps.rouletteRevealed = [];
        ps.rouletteSolved = false;
        // Re-render the panel from scratch with no revealed letters
        var container = document.getElementById('ruletaScreenPanel');
        if (container && container.style.display !== 'none' && ps.question) {
            var c = ps.question.content || {};
            var rt = ps.roundTheme || {};
            var tt = ps.typeTheme || {};
            var gt = ps.gameTheme || {};
            RoulettePanel.render(container, {
                phrase: c.phrase || '', hint: c.hint || '',

                logo: rt.logo || tt.logo || gt.logo || null,
                size: 'large', panelVisible: true,

        if (!ps) return;

            vid.pause();

            vid.currentTime = 0;

        if (!ps) return;
        if (!ps.imagePuzzle) ps.imagePuzzle = {};

        if (d.answer) ps.imagePuzzle.answerText = d.answer;

        if (ps.roundType === 'identidad') _identidadAnimateIdx = d.index;
        sfxCorrect();
    });

    // Bono usage notification banner
    var _bonoAvisoTO = null;
    socket.on('notificacion_bono', function(d) {
        if (!d.msg) return;
        document.getElementById('bonoAvisoText').textContent = d.msg;
        document.getElementById('bonoAviso').classList.add('active');
        if (_bonoAvisoTO) clearTimeout(_bonoAvisoTO);
        _bonoAvisoTO = setTimeout(function() {
            document.getElementById('bonoAviso').classList.remove('active');
            _bonoAvisoTO = null;
        }, 4000);
    });

    fetch('/api/games/' + gameId + '/public').then(function(r) { return r.json(); }).then(function(g) {
        if (g && g.name) document.getElementById('lobbyTitle').textContent = g.name;
        if (g && g.theme) applyTheme(g.theme);
    }).catch(function() {});
}

// ═══════════════ SYNC HANDLER ═══════════════
function onSync(data) {
    setTimeout(applyMediaSound, 0);
    var prevPhase = ps ? ps.phase : 'lobby';
    var prevOptRevealed = ps ? ps.optionsRevealed : false;
    var prevQIdx = ps ? ps.questionIdx : -1;
    ps = data;
    GSnd.sync();
    if (data.gameTheme) applyTheme(data.gameTheme);
    if (data.roundTheme) applyRoundTheme(data.roundTheme);

    // Detect transitions
    var phaseChanged = data.phase !== prevPhase;
    var newQuestion = data.questionIdx !== prevQIdx;
    var optionsJustRevealed = data.optionsRevealed && !prevOptRevealed;

    if (phaseChanged) {
        if (data.phase === 'answer_revealed') sfxReveal();
        if (data.phase === 'question') { lastTimerVal = 999; }
    }

    renderPhase(phaseChanged, newQuestion, optionsJustRevealed);
    renderTimer();
    renderPreCountdown();
    renderMiniScores();
    renderScoreboardOverlay();
    renderQrOverlay();
    renderPremioOverlay();
    renderPremioGanadorOverlay();

    // Estado del vídeo (reconexión): solo cuando cambia la orden del coordinador
    if (data.videoState && data.videoState.ts !== _lastVideoTs) {
        _lastVideoTs = data.videoState.ts;
        setTimeout(function() {
            var vid = document.getElementById('ifVideo');
            if (!vid) return;
            if (data.videoState.action === 'play') {
                if ((_ifUserGesture || vid.muted) && !vid.ended) playVideo(vid);
            } else if (data.videoState.action === 'pause') {
                vid.pause();
            }
        }, 100);
    }

// ═══════════════ PHASE RENDERING ═══════════════
var currentPhase = 'lobby';

function showPhase(id) {
    if (currentPhase === id) return;
    var outEl = document.getElementById('phase-' + currentPhase);
    currentPhase = id;
    var inEl = document.getElementById('phase-' + id);

    // Use crossfade for smooth transition
    if (outEl) {
        outEl.style.transition = 'opacity 1s ease-in-out';
        outEl.style.opacity = '0';
    }
    setTimeout(function() {
        document.querySelectorAll('.phase').forEach(function(el) {
            el.classList.remove('active');
            el.style.opacity = '';
            el.style.transition = '';
        });
        if (inEl) {
            inEl.style.opacity = '0';
            inEl.classList.add('active');
            void inEl.offsetHeight;
            inEl.style.transition = 'opacity 1s ease-in-out';
            inEl.style.opacity = '1';
            setTimeout(function() {
                inEl.style.transition = '';
                inEl.style.opacity = '';
            }, 1050);
        }
    }, outEl ? 1000 : 0);
}

function renderPhase(phaseChanged, newQuestion, optionsJustRevealed) {
    if (!ps) return;
    var phase = ps.phase;
    var type = ps.roundType;

    // Stop any playing video when leaving imagen_fija (phase change or question change)
    if (phaseChanged || newQuestion) {
        var vid = _ifVid; // el reproductor es siempre el mismo, esté o no en la página
        if (vid && vid.getAttribute('src')) { vid.pause(); vid.removeAttribute('src'); vid.load(); }
        _imagenFijaPrevQId = ''; // el vídeo se ha vaciado: volver a montarlo si se relanza la pregunta
    }

    document.getElementById('roundLabel').textContent = ps.roundName || '';

    var timerStrip = document.getElementById('timerStrip');
    var timerBig = document.getElementById('timerBig');

    // Hide team results overlay when not in answer_revealed
    if (phase !== 'answer_revealed') {
        document.getElementById('teamResultsOverlay').classList.remove('active');
    }

    if (phase === 'lobby') {
        showPhase('lobby');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        console.log('[DEBUG screen] lobby phase, menuLevel:', ps.menuLevel, 'gameTheme.homeBackground:', ps.gameTheme && ps.gameTheme.homeBackground, 'selectedCategory:', ps.selectedCategory);
        if (ps.gameTheme) applyTheme(ps.gameTheme);
        if (ps.menuLevel === 'home') renderScreenHomeMenu();
        else if (ps.menuLevel === 'category') renderScreenCategoryMenu();
        else renderScreenLobbyDefault();
    } else if (phase === 'waiting') {
        _screenMenuLevel = null;
        showPhase('waiting');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        if (ps.gameTheme) applyTheme(ps.gameTheme);
        var wLogo = document.getElementById('waitingLogo');
        var wLogoSrc = (ps.gameTheme && ps.gameTheme.logo) || null;
        if (wLogoSrc) { wLogo.src = wLogoSrc; wLogo.style.display = ''; }
        else { wLogo.style.display = 'none'; }
    } else if (phase === 'round_intro') {
        showPhase('round-intro');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        renderRoundIntro();
    } else if (phase === 'scoreboard') {
        // Legacy: show as full phase
        showPhase('scoreboard');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        renderScoreboard();
    } else if (phase === 'answer_revealed') {
        // Stay on question phase — reveal in-place without phase switch
        showPhase('question');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        document.getElementById('phase-question').classList.toggle('imagen-mode', type === 'imagen' || type === 'aclara');
        document.getElementById('phase-question').classList.toggle('pic-mode', type === 'pictionary');
        renderRevealedInPlace();
        renderTeamResultsOverlay();
    } else if (phase === 'question') {
        showPhase('question');
        var hideTimer = type === 'pulsador' || type === 'ruleta' || type === 'imagen' || type === 'imagen_fija' || type === 'cancion' || type === 'karaoke' || type === 'aclara'
            || ((type === 'abierta' || type === 'pictionary' || type === 'cifras' || type === 'letras') && !(ps.timer && ps.timer.total > 0)) || (type === 'letras' && ps.letras) // Respuesta abierta / Pictionary / Cifras sin cuenta atrás
            || (type === 'pictionary' && !(ps.pictionary && ps.pictionary.step === 'drawing')); // Pictionary: el reloj, al empezar a dibujar
        timerStrip.style.display = hideTimer ? 'none' : '';
        timerBig.style.display = (hideTimer || type === 'identidad') ? 'none' : '';
        document.getElementById('roundLogo').style.display = (type === 'imagen' || type === 'imagen_fija' || type === 'cancion' || type === 'identidad' || type === 'aclara' || type === 'pictionary') ? 'none' : '';
        renderQuestion(type, newQuestion, optionsJustRevealed);
    } else if (phase === 'round_end') {
        showPhase('round-end');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
    } else {
        showPhase('waiting');
        timerStrip.style.display = 'none';
        timerBig.style.display = 'none';
    }

    // No overlay on /screen — projector always shows clean view
    document.getElementById('timerOverlay').classList.remove('active');
}

// ═══════════════ QUESTION ═══════════════
function renderQuestion(type, newQuestion, optionsJustRevealed) {
    var q = ps.question;
    if (!q) return;
    var c = q.content || {};
    var stmtEl = document.getElementById('qStatement');

    stmtEl.textContent = c.statement || '';
    stmtEl.style.border = ''; stmtEl.style.background = ''; stmtEl.style.borderColor = ''; stmtEl.style.backdropFilter = ''; stmtEl.style.animation = '';
    // Algunos tipos (imagen, identidad, karaoke, canción, imagen fija) lo ocultan o le ponen brillo:
    // se restablece aquí y cada tipo lo vuelve a ocultar después si lo necesita.
    stmtEl.style.display = ''; stmtEl.style.boxShadow = '';

    // Animate statement entrance on new question
    if (newQuestion) {
        GSA.resetStatement(stmtEl);
        GSA.enterStatement(stmtEl);
    }

    // Media (precio uses its own image inside priceAnswers container)
    var media = document.getElementById('qMedia');
    if (q.media_url && type !== 'precio') { media.src = q.media_url; media.style.display = ''; }
    else { media.style.display = 'none'; }

    // Toggle fullscreen mode for imagen
    document.getElementById('phase-question').classList.toggle('imagen-mode', type === 'imagen' || type === 'aclara');
    document.getElementById('phase-question').classList.toggle('aclara-mode', type === 'aclara');
    document.getElementById('phase-question').classList.toggle('queue-over', type === 'imagen' || type === 'aclara' || type === 'imagen_fija' || type === 'cancion' || type === 'pictionary');
    document.getElementById('phase-question').classList.toggle('pic-mode', type === 'pictionary');
    document.getElementById('phase-question').classList.toggle('identidad-mode', type === 'identidad');
    _imagenState.built = type === 'imagen' ? _imagenState.built : false;

    // Hide all type-specific
    document.getElementById('qOptions').style.display = 'none';
    document.getElementById('buzzerQueue').style.display = 'none';
    document.getElementById('priceAnswers').style.display = 'none';
    document.getElementById('boomItems').style.display = 'none';
    document.getElementById('imagenScreenWrap').style.display = 'none';
    document.getElementById('aclaraScreenWrap').style.display = 'none';
    if (_aclaraPlayer && type !== 'aclara') _aclaraPlayer.stop();
    document.getElementById('imagenFijaWrap').style.display = 'none';
    document.getElementById('cancionScreenWrap').style.display = 'none';
    document.getElementById('letterPanel').style.display = 'none';
    document.getElementById('pulsadorScreen').style.display = 'none';
    document.getElementById('ruletaScreenPanel').style.display = 'none';
    document.getElementById('identidadScreenWrap').style.display = 'none';
    document.getElementById('abiertaScreenWrap').style.display = 'none';
    document.getElementById('phase-question').classList.remove('abierta-mode', 'ab-subs');
    document.getElementById('cifrasScreenWrap').style.display = 'none';
    document.getElementById('letrasScreenWrap').style.display = 'none';
    document.getElementById('phase-question').classList.toggle('cifras-mode', type === 'cifras' || type === 'letras');
    document.getElementById('karaokeScreenWrap').style.display = 'none';
    document.getElementById('picScreenWrap').style.display = 'none';
    document.getElementById('phase-question').classList.toggle('karaoke-mode', type === 'karaoke');
    document.body.classList.toggle('karaoke-screen-active', type === 'karaoke');
    _identidadAnimateIdx = -1;

    if (type === 'karaoke') {
        stmtEl.style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        renderKaraokeScreen(c, q);
        return;
    }

    if (type === 'multirespuesta') {
        renderMultiOptions(c, optionsJustRevealed, stmtEl);
    } else if (type === 'imagen') {
        stmtEl.style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        renderImageScreen(c, q);
        renderBuzzerQueue();
        document.getElementById('buzzerQueue').style.display = 'flex';
    } else if (type === 'aclara') {
        stmtEl.style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        renderAclaraScreen(c, q, false);
        renderBuzzerQueue();
        document.getElementById('buzzerQueue').style.display = 'flex';
    } else if (type === 'pictionary') {
        stmtEl.style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        renderPicScreen(c, false);
        renderBuzzerQueue();
        document.getElementById('buzzerQueue').style.display = 'flex';
    } else if (type === 'ruleta') {
        renderRuletaScreen(c, q, newQuestion);
    } else if (type === 'pulsador') {
        renderPulsadorScreen();
    } else if (type === 'cancion') {
        renderCancionScreen(c, q);
        if (ps.pulsadorActivo || (ps.colaPulsador && ps.colaPulsador.length)) {
            renderBuzzerQueue();
            document.getElementById('buzzerQueue').style.display = 'flex';
        }
    } else if (type === 'imagen_fija') {
        renderImagenFijaScreen(c, q);
        if (ps.pulsadorActivo || (ps.colaPulsador && ps.colaPulsador.length)) {
            renderBuzzerQueue();
            document.getElementById('buzzerQueue').style.display = 'flex';
        }
    } else if (type === 'precio') {
        renderPrecioScreen(c, q, newQuestion);
    } else if (type === 'boom') {
        renderBoomItems(c);
    } else if (type === 'identidad') {
        renderIdentidadScreen(c, q);
    } else if (type === 'abierta') {
        renderAbiertaScreen(c, q, false);
    } else if (type === 'cifras') {
        renderCifrasScreen(c, false);
    } else if (type === 'letras') {
        renderLetrasScreen(c, false);
    }
}

function renderMultiOptions(c, optionsJustRevealed, stmtEl) {
    var opts = c.options || [];
    var container = document.getElementById('qOptions');
    if (!opts.length || (ps && !ps.optionsRevealed)) {
        container.style.display = 'none';
        container.innerHTML = ''; // si no, al revelar saldrían las opciones de la pregunta anterior
        container.dataset.revealKey = '';
        return;
    }
    container.style.display = 'grid';
    // Adaptive grid: 2→1col, 3→3col, 4→2×2, 5+→3col
    container.classList.remove('cols-1', 'cols-3');
    if (opts.length <= 2) container.classList.add('cols-1');
    else if (opts.length === 3 || opts.length >= 5) container.classList.add('cols-3');
    var letters = ['A', 'B', 'C', 'D', 'E', 'F'];
    container.innerHTML = opts.map(function(o, i) {
        return '<div class="q-opt"><span class="opt-letter">' + letters[i] + '</span>' + esc(o) + '</div>';
    }).join('');
    container.dataset.revealKey = '';

    // Animate: stagger options in (statement stays fixed at top)
    if (optionsJustRevealed) {
        GSA.staggerOptions(container, '.q-opt', 200);
    }
}

var lastBuzzerCount = 0;
// ═══════════════ IMAGEN QUE SE ACLARA ═══════════════
var _aclaraPlayer = null;
function renderAclaraScreen(c, q, revealed) {
    document.getElementById('aclaraScreenWrap').style.display = 'flex';

// ═══════════════ PICTIONARY ═══════════════
// La pizarra se pinta con los trazos que reenvía el servidor (shared/pictionary-board.js)
var _picBoard = null, _picViewer = null;
function picTeamHtml(id, name, bold) {
    var t = (ps.equipos || []).find(function(e) { return e.id === id; });
    var photo = t && t.photo_url ? '<img src="' + esc(t.photo_url) + '" alt="">' : '';
    var n = esc(name || (t && t.nombre) || '');
    return photo + (bold ? '<b>' + n + '</b>' : '<span>' + n + '</span>');
}
function renderPicScreen(c, revealed) {
    var wrap = document.getElementById('picScreenWrap');
    wrap.style.display = 'flex';
    var p = ps.pictionary || {};
    var drawing = revealed || p.step === 'drawing';
    if (!_picBoard) {
        _picBoard = new PicBoard.Board(document.getElementById('picScrBoard'));
        _picViewer = new PicBoard.Viewer(_picBoard, socket);
    }
    _picViewer.setKey(ps.questionKey);
    var intro = document.getElementById('picScrIntro');
    var head = document.getElementById('picScrHead');
    var boardEl = document.getElementById('picScrBoard');
    var cat = c.category ? '<span class="pic-scr-cat">' + esc(c.category) + '</span>' : '';
    if (!drawing) {
        // Antes de empezar: a quién le toca, en grande
        var who = p.mode === 'ipad' ? '<div class="pi-team">¡Atentos a la pizarra!</div>'
            : (p.drawer ? '<div class="pi-team">' + picTeamHtml(p.drawer, p.drawerName) + '</div>' : '<div class="pi-team">…</div>');
        var html = '<div class="pi-icon">✏️</div>' + (p.mode === 'ipad' ? '' : '<div class="pi-label">Dibuja</div>') + who
            + (c.category ? '<div class="pi-cat">Categoría: ' + esc(c.category) + '</div>' : '');
        if (intro._h !== html) { intro.innerHTML = html; intro._h = html; }
        intro.style.display = 'flex'; head.style.visibility = 'hidden'; boardEl.style.visibility = 'hidden';
    } else {
        intro.style.display = 'none'; head.style.visibility = ''; boardEl.style.visibility = '';
        var h = (p.mode === 'ipad' ? '<span class="pic-scr-who">✏️ Pizarra</span>'
            : '<span class="pic-scr-who">✏️ Dibuja ' + picTeamHtml(p.drawer, p.drawerName, true) + '</span>') + cat
            + (!revealed && p.paused ? '<span class="pic-scr-paused">⏸ Tiempo parado</span>' : '');
        if (head._h !== h) { head.innerHTML = h; head._h = h; }
        _picBoard.fit();
    }
    var wordEl = document.getElementById('picScrWord');
    if (revealed && c.word) {
        var winner = ps.buzzerWinner ? ((ps.equipos || []).find(function(e) { return e.id === ps.buzzerWinner; }) || {}).nombre : null;
        var wh = esc(c.word) + '<small>' + (winner ? '¡Acertó ' + esc(winner) + '!' : 'Nadie lo adivinó') + '</small>';
        if (wordEl._h !== wh) { wordEl.innerHTML = wh; wordEl._h = wh; }
        wordEl.style.display = '';
    } else {
        wordEl.style.display = 'none'; wordEl._h = '';
    }
}

function renderBuzzerQueue() {
    if (!ps) return;
    var cola = ps.colaPulsador || [];
    var container = document.getElementById('buzzerQueue');
    if (cola.length > lastBuzzerCount) sfxBuzzer();
    lastBuzzerCount = cola.length;
    if (cola.length === 0) {
        container.innerHTML = '';
        return;
    }
    container.style.display = 'flex';
    container.innerHTML = cola.map(function(p, i) {
        return '<div class="buzzer-chip">' + (i === 0 ? '\u{1F514} ' : '') + esc(p.nombre) + '</div>';
    }).join('');
}

function renderPulsadorScreen() {
    if (!ps) return;
    var container = document.getElementById('pulsadorScreen');
    var q = ps.question;
    var c = q ? (q.content || {}) : {};
    var stmtEl = document.getElementById('qStatement');
    var media = document.getElementById('qMedia');

    // Show statement (same style as 50x15/boom)
    if (c.statement) {
        stmtEl.textContent = c.statement;

}

// ═══════════════ IMAGEN PUZZLE (Adivina la Imagen) ═══════════════
var _imagenState = { rows: 0, cols: 0, imgUrl: '', built: false };
var _imagenNatural = { qId: '', w: 0, h: 0 };
var _identidadAnimateIdx = -1;

function renderImageScreen(c, q) {
    var imgUrl = c.image || q.media_url || '';
    var wrap = document.getElementById('imagenScreenWrap');
    var grid = document.getElementById('imagenScreenGrid');
    wrap.style.display = 'flex';

    var qId = q.id || '';
    if (_imagenNatural.qId === qId && _imagenNatural.w > 0) {
        _doRenderImageScreen(c, q, _imagenNatural.w, _imagenNatural.h);
        return;
    }
    // New question: clear grid to avoid showing stale dimensions
    grid.innerHTML = '';
    grid.style.width = '0';
    grid.style.height = '0';
    _imagenState.built = false;

    var fallbackW = c.image_width || 16;
    var fallbackH = c.image_height || 9;
    var img = new Image();
    img.onload = function() {
        _imagenNatural = { qId: qId, w: img.naturalWidth, h: img.naturalHeight };
        _doRenderImageScreen(c, q, img.naturalWidth, img.naturalHeight);
    };
    img.onerror = function() {
        _imagenNatural = { qId: qId, w: fallbackW, h: fallbackH };
        _doRenderImageScreen(c, q, fallbackW, fallbackH);
    };
    img.src = imgUrl;
}

function _doRenderImageScreen(c, q, imgW, imgH) {
    var rows = c.grid_rows || 4;
    var cols = c.grid_cols || 6;
    var imgUrl = c.image || q.media_url || '';
    var puzzle = ps.imagePuzzle || {};
    var revealed = puzzle.revealedTiles || [];

    var wrap = document.getElementById('imagenScreenWrap');
    var grid = document.getElementById('imagenScreenGrid');

    // Compute grid size to fit container respecting aspect ratio (content area inside padding)
    var cs = getComputedStyle(wrap);
    var containerW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var containerH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var ratio = imgW / imgH;
    var gridW, gridH;
    if (containerW / containerH > ratio) {
        gridH = containerH; gridW = gridH * ratio;
    } else {
        gridW = containerW; gridH = gridW / ratio;
    }
    // Sin hueco todavía (escenario oculto): se dimensiona al aparecer, con el evento resize
    if (containerW > 0 && containerH > 0) {
        grid.style.width = Math.floor(gridW) + 'px';
        grid.style.height = Math.floor(gridH) + 'px';
    }
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';

    var needRebuild = !_imagenState.built || _imagenState.rows !== rows || _imagenState.cols !== cols || _imagenState.imgUrl !== imgUrl;
    if (needRebuild) {
        var html = '';
        var total = rows * cols;
        for (var i = 0; i < total; i++) {
            var row = Math.floor(i / cols);
            var col = i % cols;
            var bpX = cols > 1 ? (col / (cols - 1)) * 100 : 0;
            var bpY = rows > 1 ? (row / (rows - 1)) * 100 : 0;
            var isRevealed = revealed.indexOf(i) >= 0;
            html += '<div class="img-tile' + (isRevealed ? '' : ' hidden') + '" data-idx="' + i + '" style="'
                + 'background-image:url(' + esc(imgUrl) + ');'
                + 'background-size:' + (cols * 100) + '% ' + (rows * 100) + '%;'
                + 'background-position:' + bpX + '% ' + bpY + '%;'
                + '"></div>';
        }
        grid.innerHTML = html;
        _imagenState = { rows: rows, cols: cols, imgUrl: imgUrl, built: true };
    } else {
        updateImageTiles(revealed);
    }

    var ansCard = document.getElementById('imagenAnswerCard');
    var ansText = puzzle.answerText || c.answer || '';
    if (puzzle.answerVisible && ansText) {
        ansCard.textContent = ansText;
        ansCard.classList.add('visible');
    } else {
        ansCard.classList.remove('visible');
    }
}

// Si cambia el tamaño (ventana, giro del iPad o el escenario incrustado que se muestra), la imagen
// se vuelve a encajar entera, sin cortarse por ningún lado.
window.addEventListener('resize', function() {
    var wrap = document.getElementById('imagenScreenWrap');
    if (!ps || !ps.question || !wrap || wrap.style.display === 'none' || !_imagenNatural.w) return;
    if (_imagenNatural.qId !== (ps.question.id || '')) return;
    _doRenderImageScreen(ps.question.content || {}, ps.question, _imagenNatural.w, _imagenNatural.h);
});

function updateImageTiles(revealed) {
    var tiles = document.querySelectorAll('#imagenScreenGrid .img-tile');
    for (var i = 0; i < tiles.length; i++) {
        var idx = parseInt(tiles[i].dataset.idx);
        if (revealed.indexOf(idx) >= 0) {
            tiles[i].classList.remove('hidden');
        } else {
            tiles[i].classList.add('hidden');
        }
    }
}

function updateImageAnswer(visible, answerText) {
    var ansCard = document.getElementById('imagenAnswerCard');
    if (!ansCard) return;
    if (visible) {
        var text = answerText || (ps && ps.imagePuzzle && ps.imagePuzzle.answerText) || '';
        if (text) { ansCard.textContent = text; ansCard.classList.add('visible'); }
    } else {
        ansCard.classList.remove('visible');
    }
}
