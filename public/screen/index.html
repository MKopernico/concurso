// ═══════════════ RESPUESTA ABIERTA — SCREEN ═══════════════
// Enunciado general → subpreguntas → «X de Y equipos han respondido» → «Corrigiendo…» → se
// revelan una a una con la respuesta correcta a la derecha.
function renderAbiertaScreen(c, q, revealed) {
    var a = ps.abierta || {}, step = a.step || 'intro';
    var subs = c.subs || [];
    var pq = document.getElementById('phase-question');
    var wrap = document.getElementById('abiertaScreenWrap');
    var stmt = document.getElementById('qStatement');
    var showSubs = revealed || step !== 'intro';
    pq.classList.add('abierta-mode');
    pq.classList.toggle('ab-subs', showSubs);
    // Al volver a abrir la pantalla con la pregunta ya revelada, el enunciado se rellena aquí
    stmt.textContent = c.statement || ''; stmt.style.display = c.statement ? '' : 'none';
    var md = document.getElementById('qMedia');
    if (q && q.media_url) { if (md.getAttribute('src') !== q.media_url) md.src = q.media_url; md.style.display = showSubs ? 'none' : ''; }
    else md.style.display = 'none';
    // Con las subpreguntas a la vista el logo ocuparía su sitio
    document.getElementById('roundLogo').style.display = showSubs ? 'none' : '';
    wrap.style.display = showSubs ? 'flex' : 'none';
    if (!showSubs) return;

    var list = document.getElementById('absList');
    var rs = revealed ? (a.revealStep || 0) : 0;
    list.classList.toggle('two', subs.length > 5);
    list.classList.toggle('many', subs.length > 4);
    var html = subs.map(function(s, i) {
        var shown = revealed && i < rs;
        return '<div class="abs-row' + (shown ? ' ok' : '') + (shown && i === rs - 1 ? ' just' : '') + '"><span class="abs-num">' + (i + 1) + '</span>'
            + '<span class="abs-q">' + esc(s.text || '') + '</span>'
            + (revealed ? '<span class="abs-a' + (shown ? '' : ' pending') + '">' + (shown ? esc(s.answer || '') : '?') + '</span>' : '') + '</div>';
    }).join('');
    setHtmlIfChanged(list, html);

    var band = document.getElementById('absBand');
    var bandHtml = '', bandCls = 'abs-band';
    if (!revealed && step === 'open') {
        var active = (ps.equipos || []).filter(function(e) { return !e.bloqueado; });
        var answered = active.filter(function(e) { return (ps.answeredTeams || []).indexOf(e.id) >= 0; }).length;
        bandHtml = '✍️ <b>' + answered + '</b> de ' + active.length + ' equipos han respondido';
        if (active.length && answered >= active.length) bandCls += ' done';
    } else if (!revealed && step === 'correcting') {
        bandHtml = '✍️ Corrigiendo…'; bandCls += ' correcting';
    }
    band.className = bandCls;
    setHtmlIfChanged(band, bandHtml);
}

// ═══════════════ LETRAS — SCREEN ═══════════════
// Pregunta: las letras en grande y cuántos equipos han enviado; cerrada, «Corrigiendo…». Revelado:
// una fila por longitud (de la más corta a la más larga) con las palabras, quién las puso y si
// valen; al final, la más larga posible, el 🏆 y los puntos.
var _ltsKey = null;
function renderLetrasScreen(c, revealed) {
    var pq = document.getElementById('phase-question');
    pq.classList.add('cifras-mode');
    document.getElementById('qStatement').style.display = 'none';
    document.getElementById('qMedia').style.display = 'none';
    document.getElementById('roundLogo').style.display = 'none';
    var wrap = document.getElementById('letrasScreenWrap');
    wrap.style.display = 'flex';
    var L = ps.letras;
    var rev = !!(revealed && L && L.step === 'revealed');
    wrap.classList.toggle('rev', rev);
    var animate = _ltsKey !== ps.questionKey;
    _ltsKey = ps.questionKey;
    var letters = '<div class="lts-letters">' + (c.letters || []).map(function(l, i) {
        return '<div class="lts-l' + (animate && !rev ? ' in' : '') + '" style="animation-delay:' + (i * 0.1) + 's">' + esc(l) + '</div>';
    }).join('') + '</div>';
    var html;
    if (!rev) {
        var band;
        if (L) band = '<div class="abs-band correcting">✍️ Corrigiendo…</div>';
        else if (!ps.optionsRevealed) band = '<div class="abs-band">🔤 Mirad bien las letras…</div>';
        else {
            var active = (ps.equipos || []).filter(function(e) { return !e.bloqueado; });
            var sent = ps.cifrasSent || 0;
            band = '<div class="abs-band' + (active.length && sent >= active.length ? ' done' : '') + '">🔤 <b>' + sent + '</b> de ' + active.length + ' equipos han enviado</div>';
        }
        html = letters + band;
        // Las letras se quedan quietas mientras llegan envíos: solo cambia la banda
        if (!animate && wrap._letters === letters && wrap.querySelector('.abs-band')) {
            var b = wrap.querySelector('.abs-band');
            if (b.outerHTML !== band) b.outerHTML = band;
        } else { wrap.innerHTML = html; wrap._letters = letters; }
        wrap._html = null;
        return;
    }
    wrap._letters = null;
    var lqs = ps.lastQuestionScores || {};
    var done = L.revealStep >= L.total;
    var teamName = function(id) { var e = (ps.equipos || []).find(function(x) { return x.id === id; }); return e ? e.nombre : '?'; };
    var groups = L.groups || [];
    var MAX = 4;
    var rows = groups.slice(-MAX).map(function(g, k, arr) {
        var last = k === arr.length - 1 && !done;
        return '<div class="lts-row' + (last ? ' last' : '') + '"><span class="lts-len"><b>' + g.len + '</b>letras</span><span class="lts-words">'
            + g.words.map(function(x) {
                var teams = x.teams.map(function(t) {
                    var r = lqs[t] || {};
                    return (done && L.winner === t ? '🏆 ' : '') + esc(teamName(t)) + (done && r.points > 0 ? '<span class="cfs-pts">+' + r.points + '</span>' : '');
                }).join(', ');
                return '<span class="lts-w ' + (x.ok ? 'ok' : 'bad') + '"><span class="ww">' + esc(Letras.upper(x.show || x.w)) + '</span><span class="wt">' + teams + '</span></span>';
            }).join('') + '</span></div>';
    }).join('');
    if (!groups.length) rows = '<div class="cfs-wait">' + ((L.groupsTotal || 0) ? '👀 ¿Quién ha encontrado la más larga?' : 'Nadie envió ninguna palabra') + '</div>';
    var best = L.best && L.best.words && L.best.words.length
        ? '<div class="cfs-sol"><b>LA MÁS LARGA POSIBLE · ' + L.best.len + ' LETRAS</b>' + esc(L.best.words.slice(0, 4).map(Letras.upper).join('   ·   ')) + '</div>' : '';
    var full = letters + '<div class="lts-list">' + rows + '</div>' + best;
    if (wrap._html !== full) { wrap.innerHTML = full; wrap._html = full; }
}

// ═══════════════ CIFRAS — SCREEN ═══════════════
// Pregunta: el objetivo en grande, los números y cuántos equipos han enviado. Revelado: los grupos
// (mismo resultado) del más lejano al más cercano según el coordinador los destapa; el último, con
// las cuentas de cada equipo; si nadie la clavó, al final la solución. Los puntos, al terminar.
var _cfsKey = null;
function renderCifrasScreen(c, revealed) {
    var pq = document.getElementById('phase-question');
    pq.classList.add('cifras-mode');
    document.getElementById('qStatement').style.display = 'none';
    document.getElementById('qMedia').style.display = 'none';
    document.getElementById('roundLogo').style.display = 'none';
    var wrap = document.getElementById('cifrasScreenWrap');
    wrap.style.display = 'flex';
    wrap.classList.toggle('rev', !!revealed);
    var animate = _cfsKey !== ps.questionKey;
    _cfsKey = ps.questionKey;
    var nums = (c.numbers || []).map(function(v, i) {
        return '<div class="cfs-num' + (animate && !revealed ? ' in' : '') + '" style="animation-delay:' + (i * 0.12) + 's">' + esc(v) + '</div>';
    }).join('');
    var top = '<div class="cfs-top"><div class="cfs-tl">OBJETIVO</div><div class="cfs-target">' + esc(c.target) + '</div><div class="cfs-nums">' + nums + '</div></div>';
    if (!revealed) {
        var band;
        if (!ps.optionsRevealed) band = '<div class="abs-band">🔢 Mirad bien los números…</div>';
        else {
            var active = (ps.equipos || []).filter(function(e) { return !e.bloqueado; });
            var sent = ps.cifrasSent || 0;
            band = '<div class="abs-band' + (active.length && sent >= active.length ? ' done' : '') + '">🔢 <b>' + sent + '</b> de ' + active.length + ' equipos han enviado</div>';
        }
        // Las fichas se quedan quietas mientras llegan envíos: solo cambia la banda
        if (animate || !wrap.querySelector('.cfs-top') || wrap.classList.contains('was-rev')) { wrap.innerHTML = top + '<div class="cfs-wait"></div>' + band; wrap.classList.remove('was-rev'); }
        else { var b = wrap.querySelector('.abs-band'); if (b && b.outerHTML !== band) b.outerHTML = band; }
        return;
    }
    wrap.classList.add('was-rev');
    var cv = ps.cifras || { revealStep: 0, total: 0, groups: [] };
    var lqs = ps.lastQuestionScores || {};
    var done = cv.revealStep >= cv.total;
    var teamName = function(id) { var e = (ps.equipos || []).find(function(x) { return x.id === id; }); return e ? e.nombre : '?'; };
    var shown = cv.groups.slice(0, cv.revealStep);
    var MAX = 5;
    var older = shown.length > MAX ? shown.slice(0, shown.length - MAX) : [];
    var visible = shown.slice(-MAX);
    var html = '';
    if (older.length) html += '<div class="cfs-older">Más lejos: ' + older.map(function(g) {
        var r = lqs[g.teams[0]] || {};
        return (r.value == null ? '—' : esc(r.value)) + ' (' + g.teams.map(function(t) { return esc(teamName(t)); }).join(', ') + ')';
    }).join(' · ') + '</div>';
    visible.forEach(function(g, k) {
        var last = k === visible.length - 1 && !done;
        var r0 = lqs[g.teams[0]] || {};
        var teams = g.teams.map(function(t) {
            var r = lqs[t] || {};
            var pts = done && r.points > 0 ? '<span class="cfs-pts">+' + r.points + '</span>' : '';
            var steps = (last || g.dist === 0) && (r.path || []).length ? '<span class="cfs-steps">' + esc(r.path.map(Cifras.fmtStep).join('   ·   ')) + '</span>' : '';
            return '<span class="' + (steps ? 'blk' : 'inl') + '">' + (done && cv.winner === t ? '🏆 ' : '') + esc(teamName(t)) + pts + steps + '</span>';
        }).join('');
        var win = done && cv.winner && g.teams.indexOf(cv.winner) >= 0;
        html += '<div class="cfs-row' + (last ? ' last' : '') + (g.dist === 0 ? ' exact' : '') + (win ? ' win' : '') + '">'
            + '<span class="cfs-val">' + (r0.value == null ? '—' : esc(r0.value)) + '</span>'
            + '<span class="cfs-dist">' + (g.dist === null ? 'sin resultado' : g.dist === 0 ? '¡EXACTO!' : 'a ' + g.dist) + '</span>'
            + '<span class="cfs-teams">' + teams + '</span></div>';
    });
    if (!shown.length) html = '<div class="cfs-wait">' + (cv.groups.length ? '👀 ¿Quién se ha acercado más?' : 'Nadie envió ningún número') + '</div>';
    var sol = Array.isArray(cv.solution) && cv.solution.length && !(cv.groups.length && cv.groups[cv.groups.length - 1].dist === 0)
        ? '<div class="cfs-sol"><b>SE PODÍA ASÍ</b>' + esc(cv.solution.map(Cifras.fmtStep).join('   ·   ')) + '</div>' : '';
    var full = top + '<div class="cfs-list">' + html + '</div>' + sol;
    if (wrap._html !== full) { wrap.innerHTML = full; wrap._html = full; }
}

function identidadCardHtml(item, mirror, extraClass) {
    if (!item) return '<div class="id-card' + (mirror ? ' id-mirror' : '') + (extraClass || '') + '"></div>';
    var cls = 'id-card' + (mirror ? ' id-mirror' : '') + (extraClass || '');
    var html = '<div class="' + cls + '">';
    if (item.image) {
        html += '<img class="id-card-img" src="' + esc(item.image) + '" draggable="false">';
    }
    if (item.text) {
        html += '<span class="id-card-text">' + esc(item.text) + '</span>';
    }

function renderKaraokeBackground(colors, numColors, activeCombo, finished, winnerColor) {
    var hex = window.KARAOKE_COLOR_HEX || {};
    // Qué colores se pintan: los que cantan ahora; al terminar, el ganador; antes de empezar,
    // todos los de la canción apagados.
    var list, muted = false;
    if (finished) list = winnerColor ? [winnerColor] : colors.slice(0, numColors);
    else if (activeCombo && activeCombo.length) list = activeCombo.slice(0, 4);
    else { list = colors.slice(0, numColors); muted = true; }
    if (!list.length) list = ['rojo'];
    var html = '<div class="karaoke-screen-bg kb-n' + list.length + '">';
    list.forEach(function(col) {
        html += '<div class="karaoke-screen-zone ' + (muted ? 'karaoke-screen-zone--muted' : 'karaoke-screen-zone--active') + '" style="background:' + (hex[col] || '#888') + ';"></div>';
    });
    return html + '</div>';
}

function renderKaraokeLyrics(blocks, blockIdx, activeCombo, finished, winnerColor, colors) {
    var hex = window.KARAOKE_COLOR_HEX || {};
    var html = '<div class="karaoke-screen-lyrics">';

    if (finished) {
        html += '<div class="karaoke-screen-fin">FIN</div>';
        if (winnerColor) {
            var colHex = hex[winnerColor] || '#888';
            html += '<div class="karaoke-screen-winner">';
            html += '<span>Ganó</span>';
            html += '<span class="karaoke-screen-winner-dot" style="background:' + colHex + ';"></span>';
            html += '<span>' + esc(winnerColor) + '</span>';
            html += '</div>';
        }
    } else if (blockIdx < 0 || !activeCombo) {
        html += '<div class="karaoke-screen-pre">🎤 Preparados...</div>';
    } else {
        html += '<div class="karaoke-screen-current">' + esc(blocks[blockIdx] || '') + '</div>';
        if (blockIdx < blocks.length - 1) {
            html += '<div class="karaoke-screen-next">' + esc(blocks[blockIdx + 1] || '') + '</div>';
        }
    }

    html += '</div>';
    return html;
}

// Ajusta la letra al hueco: la estrofa actual lo más grande posible (hasta ~70 % del alto si hay
// siguiente) y la siguiente más pequeña debajo. Búsqueda binaria del tamaño de letra.
function fitKaraokeLyrics() {
    var box = document.querySelector('#karaokeScreenWrap .karaoke-screen-lyrics');
    if (!box || !box.offsetParent) return;
    var cur = box.querySelector('.karaoke-screen-current');
    var next = box.querySelector('.karaoke-screen-next');
    if (!cur) return;
    var W = box.clientWidth, H = box.clientHeight;
    var gap = parseFloat(getComputedStyle(box).rowGap) || 0;
    function search(el, maxH, maxPx) {
        var lo = 16, hi = Math.max(17, maxPx + 1);
        while (hi - lo > 1) {
            var mid = (lo + hi) >> 1;
            el.style.fontSize = mid + 'px';
            if (el.scrollHeight <= maxH && el.scrollWidth <= W) lo = mid; else hi = mid;
        }
        el.style.fontSize = lo + 'px';
        return lo;
    }
    // Primero respetando los saltos de línea de la letra (sin partir versos); si así queda
    // demasiado pequeña (versos muy largos), se deja que los versos se partan.
    function fit(el, maxH, maxPx) {
        el.style.whiteSpace = 'pre';
        var size = search(el, maxH, maxPx);
        if (size < Math.min(maxPx * 0.45, H * 0.075)) { el.style.whiteSpace = 'pre-line'; size = search(el, maxH, maxPx); }
        return size;
    }
    var curH = next ? (H - gap) * 0.7 : H;
    var size = fit(cur, curH, Math.round(H * 0.3));
    if (next) fit(next, H - gap - Math.min(curH, cur.scrollHeight), Math.round(size * 0.5));
}
window.addEventListener('resize', function() { fitKaraokeLyrics(); });

function renderTimer() {
    if (!ps) return;
    var t = ps.timer || {};
    var rem = t.remaining || 0;
    var total = t.total || 0;
    var pct = total > 0 ? (rem / total) * 100 : 0;

    if (rem <= 5 && rem > 0 && rem < lastTimerVal && t.running) sfxCountdown();
    lastTimerVal = rem;

    var fill = document.getElementById('timerFill');
    fill.style.width = pct + '%';
    fill.className = 'timer-strip-fill' + (rem <= 5 && rem > 0 ? ' danger' : '');

    var big = document.getElementById('timerBig');
    var m = Math.floor(rem / 60);
    var s = rem % 60;
    big.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    big.className = 'timer-big' + (rem <= 5 && rem > 0 ? ' danger' : '');

    var idTimer = document.getElementById('idTimerBig');
    if (idTimer) {
        idTimer.textContent = big.textContent;
        idTimer.className = 'id-timer' + (rem <= 5 && rem > 0 ? ' danger' : '');
    }
}

function renderRevealed() {

    var revOpts = document.getElementById('revOptions');
    revOpts.style.display = 'none';

    if (type === 'multirespuesta') {
        var opts = c.options || [];
        var correct = c.correct;
        var letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        var correctIndices = Array.isArray(correct) ? correct : (typeof correct === 'number' ? [correct] : []);
        document.getElementById('revAnswer').textContent = correctIndices.map(function(i) { return letters[i] + ' — ' + (opts[i] || ''); }).join(', ');
        revOpts.style.display = 'grid';
        revOpts.innerHTML = opts.map(function(o, i) {

                '<span class="opt-letter">' + letters[i] + '</span>' + esc(o) + '</div>';
        }).join('');

        // Apply shared animations: glow correct, dim wrong
        GSA.revealAnswer(revOpts, '.rev-opt.correct', '.rev-opt:not(.correct)');
    } else if (type === 'precio') {
        document.getElementById('revAnswer').textContent = c.correct_value || c.answer || '';

        var order = c.correct_order || [];
        var items = c.items || [];
        var stepR = typeof ps.boomStep === 'number' ? ps.boomStep : order.length;
        document.getElementById('revAnswer').textContent = order.map(function(i, pos) { return pos < stepR ? (items[i] || i) : '?'; }).join(' → ') || c.answer || '';
    } else {
        document.getElementById('revAnswer').textContent = c.answer || '';
    }

    renderMiniScores();

// ═══════════════ REVEAL IN-PLACE (on question phase) ═══════════════
function renderRevealedInPlace() {
    if (!ps || !ps.question) return;
    var c = ps.question.content || {};
    var type = ps.roundType;

    // Al abrir o recargar la pantalla con la respuesta ya revelada no ha pasado por la fase de
    // pregunta: el enunciado y la imagen se rellenan aquí (cada tipo los ajusta después)
    if (type === 'multirespuesta' || type === 'boom' || type === 'precio') {
        var st = document.getElementById('qStatement');
        st.textContent = c.statement || ''; st.style.display = '';
        var md = document.getElementById('qMedia');
        if (ps.question.media_url && type !== 'precio') { if (md.getAttribute('src') !== ps.question.media_url) md.src = ps.question.media_url; md.style.display = ''; }
        else if (type !== 'precio') md.style.display = 'none';
    }

    if (type === 'multirespuesta') {
        var opts = c.options || [];
        var correct = c.correct;
        var correctIndices = Array.isArray(correct) ? correct : (typeof correct === 'number' ? [correct] : []);
        var container = document.getElementById('qOptions');
        // Siempre a partir de las opciones de ESTA pregunta (una vez por pregunta)
        if (container.dataset.revealKey !== ps.questionKey || !container.children.length) {
            var letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            container.innerHTML = opts.map(function(o, i) {
                return '<div class="q-opt"><span class="opt-letter">' + letters[i] + '</span>' + esc(o) + '</div>';
            }).join('');
            container.dataset.revealKey = ps.questionKey;
        }
        container.style.display = 'grid';
        // Apply correct/dimmed classes with transition
        var optEls = container.querySelectorAll('.q-opt');
        optEls.forEach(function(el, i) {
            el.classList.remove('correct', 'dimmed');
            if (correctIndices.indexOf(i) >= 0) {
                el.classList.add('correct');
            } else {
                el.classList.add('dimmed');
            }
        });
    } else if (type === 'boom') {
        var items = c.items || [];
        var order = c.correct_order || [];
        var container = document.getElementById('boomItems');
        container.style.display = 'flex';
        // Orden correcto con flechas; se destapa posición a posición (ps.boomStep) con «Ir revelando»
        var step = typeof ps.boomStep === 'number' ? ps.boomStep : order.length;
        var html = '';
        order.forEach(function(origIdx, pos) {
            if (pos > 0) html += '<div class="boom-arrow' + (pos < step ? '' : ' pending') + '">↓</div>';
            if (pos < step) html += '<div class="boom-item correct' + (pos === step - 1 ? ' just' : '') + '"><span class="boom-num">' + (pos + 1) + '</span>' + esc(items[origIdx] || '') + '</div>';
            else html += '<div class="boom-item pending"><span class="boom-num">' + (pos + 1) + '</span>?</div>';
        });
        if (container.dataset.html !== html) { container.innerHTML = html; container.dataset.html = html; }
    } else if (type === 'precio') {
        renderPrecioRevealScreen();
    } else if (type === 'aclara') {
        // La imagen queda nítida con la respuesta encima
        document.getElementById('buzzerQueue').style.display = 'none';
        document.getElementById('qStatement').style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        renderAclaraScreen(c, ps.question, true);
    } else if (type === 'imagen') {
        // Keep the image grid visible, hide buzzer queue, show answer via overlay
        document.getElementById('imagenScreenWrap').style.display = 'flex';
        document.getElementById('buzzerQueue').style.display = 'none';
        document.getElementById('qStatement').style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        // Reveal all tiles
        var rows = c.grid_rows || 4;
        var cols = c.grid_cols || 6;
        var allTiles = [];
        for (var t = 0; t < rows * cols; t++) allTiles.push(t);
        updateImageTiles(allTiles);
        // Show answer overlay if present
        if (c.answer) updateImageAnswer(true, c.answer);
    } else if (type === 'pulsador' || type === 'cancion' || type === 'imagen_fija') {
        // Same reveal pattern as precio/50x15: white text, dark base + green tint, green border/glow
        var stmtEl = document.getElementById('qStatement');
        var answer = c.answer || '';
        stmtEl.innerHTML = '<div style="font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:4px;color:#fff;margin-bottom:8px;text-shadow:0 0 10px rgba(255,255,255,.3);">RESPUESTA CORRECTA</div>'
            + '<div style="font-size:clamp(1.4rem,2.8vw,2.4rem);font-weight:800;color:#fff;">' + esc(answer) + '</div>';
        stmtEl.style.display = '';
        stmtEl.style.border = '2px solid var(--green)';
        stmtEl.style.background = 'linear-gradient(rgba(34,197,94,.30),rgba(34,197,94,.30)),rgba(0,0,0,.60)';
        stmtEl.style.boxShadow = '0 0 20px rgba(34,197,94,.3)';
        stmtEl.style.backdropFilter = 'blur(6px)';
        stmtEl.style.animation = 'reveal-pop .6s cubic-bezier(.34,1.56,.64,1)';
        // Hide pulsador queue and imagen fija
        document.getElementById('pulsadorScreen').style.display = 'none';
        document.getElementById('buzzerQueue').style.display = 'none';
        document.getElementById('imagenFijaWrap').style.display = 'none';
        document.getElementById('cancionScreenWrap').style.display = 'none';
    } else if (type === 'pictionary') {
        // El dibujo se queda en pantalla con la palabra encima
        document.getElementById('buzzerQueue').style.display = 'none';
        document.getElementById('qStatement').style.display = 'none';
        document.getElementById('qMedia').style.display = 'none';
        document.getElementById('roundLogo').style.display = 'none';
        renderPicScreen(c, true);
    } else if (type === 'identidad') {
        renderIdentidadReveal();
    } else if (type === 'abierta') {
        renderAbiertaScreen(c, ps.question, true);
    } else if (type === 'cifras') {
        renderCifrasScreen(c, true);
    } else if (type === 'letras') {
        renderLetrasScreen(c, true);
    } else if (type === 'ruleta') {
        // El panel se queda en pantalla con la frase completa
        var rc = document.getElementById('ruletaScreenPanel');
        if (rc && rc.dataset.solvedKey !== ps.questionKey) {
            rc.dataset.solvedKey = ps.questionKey;
            rc.style.display = 'block';
            var gtR = ps.gameTheme || {}, rtR = ps.roundTheme || {}, ttR = ps.typeTheme || {};
            RoulettePanel.render(rc, {
                phrase: c.phrase || '', hint: c.hint || '',
                revealedLetters: ps.rouletteRevealed || [], solved: true,
                logo: rtR.logo || ttR.logo || gtR.logo || null,
                size: 'large', panelVisible: true,
                background: rtR.background || ttR.background || null
            });
        }
    } else if (type === 'karaoke') {
        // Nada que revelar: la pantalla de karaoke ya muestra el ganador
    } else {
        // For other types, fall back to legacy revealed phase
        renderRevealed();
        showPhase('revealed');
    }
}

// ═══════════════ TEAM RESULTS OVERLAY ═══════════════
function renderTeamResultsOverlay() {
    var overlay = document.getElementById('teamResultsOverlay');
    if (!ps) { overlay.classList.remove('active'); return; }
    if (ps.phase !== 'answer_revealed' || !ps.showTeamResults) {
        overlay.classList.remove('active');
        return;
    }
    var lqs = ps.lastQuestionScores || {};
    var equipos = ps.equipos || [];
    var c = ps.question ? (ps.question.content || {}) : {};
    var type = ps.roundType;
    var letters = ['A','B','C','D','E','F','G','H'];

    var html = '';
    equipos.forEach(function(eq) {
        var r = lqs[eq.id] || { answer: null, correct: false, points: 0, noAnswer: true };
        var icon = r.noAnswer ? '&#9899;' : (r.correct ? '&#9989;' : '&#10060;');
        var cardClass = r.noAnswer ? 'no-answer' : (r.correct ? 'correct' : 'wrong');

        var ansText = '';
        if (r.noAnswer) {
            ansText = 'Sin respuesta';
        } else if (type === 'multirespuesta' && c.options) {
            var picks = Array.isArray(r.answer) ? r.answer : [r.answer];
            ansText = picks.map(function(i) { return letters[i] + ' — ' + (c.options[i] || ''); }).join(', ');
        } else if (type === 'precio') {
            ansText = String(r.answer);
        } else if (type === 'boom' && c.items) {
            var order = Array.isArray(r.answer) ? r.answer : [];
            ansText = order.map(function(i) { return c.items[i] || i; }).join(' → ');
        } else if (type === 'abierta' && Array.isArray(r.marks)) {
            ansText = r.marks.map(function(m) { return m ? '✓' : '✗'; }).join(' ') + '  ·  ' + r.correctCount + ' de ' + r.totalSubs + (r.winner ? '  ·  🏆' : '');
            cardClass = r.correctCount > 0 ? 'correct' : 'wrong'; icon = r.correctCount > 0 ? '&#9989;' : '&#10060;';
        } else {
            ansText = String(r.answer || '');
        }

        var ptsClass = r.points > 0 ? 'positive' : (r.points < 0 ? 'negative' : 'zero');
        var ptsText = r.points > 0 ? '+' + r.points : String(r.points);
        var photoHtml = eq.photo_url
            ? '<img class="tr-photo" src="' + esc(eq.photo_url) + '">'
            : '<div class="tr-photo" style="display:flex;align-items:center;justify-content:center;font-size:24px;">&#128100;</div>';

        html += '<div class="tr-card ' + cardClass + '">'
            + '<span class="tr-icon">' + icon + '</span>'
            + photoHtml
            + '<span class="tr-name">' + esc(eq.nombre) + '</span>'
            + '<span class="tr-answer-text">' + esc(ansText) + '</span>'
            + '<span class="tr-pts ' + ptsClass + '">' + ptsText + '</span>'
            + '</div>';
    });

    setHtmlIfChanged(document.getElementById('teamResultsCards'), html);
    overlay.classList.add('active');
}

// ═══════════════ UTILS ═══════════════
// Sustituye el contenido solo si cambia (evita repetir animaciones de entrada en cada sync)
// Desplazamiento automático de las listas del proyector (resultados por equipo y marcador):
// si todo cabe no se mueve; si no, espera 2,5 s, baja despacio hasta el final, espera y vuelve
// a subir, en bucle. Así se ven todos los equipos sin barras de scroll.
(function() {
    var SPEED = 40;    // píxeles por segundo
    var PAUSE = 2500;  // ms quieto arriba y abajo
    var lists = ['.tr-container', '#scoreboardOverlay .sb-overlay-inner'];
    var st = new Map(); // elemento → { dir, waitUntil, pos }
    var last = performance.now();
    function visible(el) { return el.offsetParent !== null && el.closest('.active') !== null; }
    function tick(t) {
        var dt = Math.min(100, t - last); last = t;
        lists.forEach(function(sel) {
            var el = document.querySelector(sel);
            if (!el) return;
            var max = el.scrollHeight - el.clientHeight;
            var s = st.get(el);
            if (!visible(el) || max <= 4) { if (s) { el.scrollTop = 0; st.delete(el); } return; }
            if (!s) { s = { dir: 1, waitUntil: t + PAUSE, pos: 0 }; st.set(el, s); el.scrollTop = 0; }
            if (t < s.waitUntil) return;
            s.pos = Math.max(0, Math.min(max, s.pos + s.dir * SPEED * dt / 1000));
            el.scrollTop = s.pos;
            if ((s.dir > 0 && s.pos >= max) || (s.dir < 0 && s.pos <= 0)) { s.dir = -s.dir; s.waitUntil = t + PAUSE; }
        });
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick); // no es decorativo: es la única forma de ver a todos los equipos
})();

function setHtmlIfChanged(el, html) {
    if (!el) return false;
    if (el._gsHtml === html && el.innerHTML === el._gsDom) return false; // mismo contenido y nadie lo ha tocado
    el.innerHTML = html;
    el._gsHtml = html;
    el._gsDom = el.innerHTML;
    return true;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    setTimeout(function() { el.classList.remove('show'); }, 3000);

var _bgKey = null;
function paintBgLayer(resolved) {
    var key = JSON.stringify(resolved || null);
    if (key === _bgKey) return; // mismo fondo: no reiniciar animaciones
    _bgKey = key;
    var bgLayer = document.getElementById('bgLayer');
    bgLayer.className = 'bg-layer';
    bgLayer.style.cssText = '';
    if (!resolved || resolved.type === 'none') return;
    if (resolved.type === 'color') {
        document.documentElement.style.setProperty('--bg', resolved.value);
        bgLayer.style.background = resolved.value;
    } else if (resolved.type === 'gradient') {
        bgLayer.style.background = resolved.value;
        bgLayer.style.backgroundSize = '300% 300%';
        bgLayer.classList.add('bg-gradient-anim');
    } else if (resolved.type === 'image') {
        bgLayer.style.backgroundImage = 'url(' + resolved.value + ')';
        bgLayer.classList.add('bg-image-cover');
    }
}

var _themeKey = null;
function applyTheme(theme) {
    // Clave del tema TAL COMO LLEGA (resolveBackground lo modifica después y la comparación
    // con currentTheme fallaba siempre: partículas y fondo se recreaban en cada sync)
    var key = theme ? JSON.stringify(theme) : null;
    if (!theme || key === _themeKey) return;
    _themeKey = key;
    currentTheme = theme;
    var root = document.documentElement;

    if (theme.primaryColor) {
        root.style.setProperty('--cyan', theme.primaryColor);
        var r = parseInt(theme.primaryColor.slice(1,3),16), g = parseInt(theme.primaryColor.slice(3,5),16), b = parseInt(theme.primaryColor.slice(5,7),16);
        root.style.setProperty('--glow-cyan', '0 0 20px rgba('+r+','+g+','+b+',.4), 0 0 60px rgba('+r+','+g+','+b+',.15)');
    }
    if (theme.secondaryColor) {
        var gold = GameShowShared.Theme.readableOnDark(theme.secondaryColor); // un azul marino no se lee sobre el fondo oscuro
        root.style.setProperty('--gold', gold);
        var r2 = parseInt(gold.slice(1,3),16), g2 = parseInt(gold.slice(3,5),16), b2 = parseInt(gold.slice(5,7),16);
        root.style.setProperty('--glow-gold', '0 0 20px rgba('+r2+','+g2+','+b2+',.4), 0 0 60px rgba('+r2+','+g2+','+b2+',.15)');
    }

    var resolved = GameShowShared.Theme.resolveBackground(theme, {}, null);
    paintBgLayer(resolved);

    var logo = document.getElementById('gameLogo');
    if (theme.logo) { logo.src = theme.logo; logo.style.display = ''; }
    else { logo.style.display = 'none'; }

    createParticles(theme.primaryColor || '#00d4ff');
}

// ═══════════════ SOUND ENGINE ═══════════════
var audioCtx = null;
function initAudioCtx() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playTone(freq, duration, type, vol) {
    if (!soundAllowed()) return;
    initAudioCtx();
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxBuzzer() { playTone(880, 0.15, 'square', 0.12); setTimeout(function(){ playTone(1100, 0.12, 'square', 0.1); }, 100); }
function sfxCorrect() { playTone(523, 0.12, 'sine', 0.15); setTimeout(function(){ playTone(659, 0.12, 'sine', 0.15); }, 120); setTimeout(function(){ playTone(784, 0.2, 'sine', 0.15); }, 240); }
function sfxWrong() { playTone(200, 0.3, 'sawtooth', 0.1); setTimeout(function(){ playTone(150, 0.4, 'sawtooth', 0.08); }, 200); }
function sfxCountdown() { playTone(600, 0.08, 'sine', 0.1); }
function sfxBlock() { playTone(150, 0.2, 'square', 0.08); setTimeout(function(){ playTone(100, 0.3, 'square', 0.06); }, 150); }
function sfxReveal() { playTone(440, 0.1, 'sine', 0.12); setTimeout(function(){ playTone(660, 0.1, 'sine', 0.12); }, 80); setTimeout(function(){ playTone(880, 0.15, 'sine', 0.15); }, 160); }

// Coloca las casillas del menú (categorías o rondas) en la rejilla que las hace lo más grandes
// posible sin que ninguna se salga de la pantalla, sea cual sea su número. El logo se reduce
// cuando hay muchas casillas.
function fitScreenMenu() {
    var c = document.getElementById('screenMenuContainer');
    if (!c || c.style.display === 'none') return;
    var grid = c.querySelector('.screen-menu-grid');
    if (!grid || !grid.children.length) return;
    var n = grid.children.length;
    var area = document.getElementById('phase-lobby').getBoundingClientRect();
    var W = area.width - 80, H = area.height - 80; // padding de .screen-menu
    var logo = c.querySelector('.screen-menu-logo');
    if (logo && logo.style.display !== 'none') {
        var lh = Math.round(Math.min(240, H * (n > 6 ? 0.18 : 0.26)));
        logo.style.maxHeight = lh + 'px';
        logo.style.marginBottom = Math.round(lh * 0.15) + 'px';
        H -= lh * 1.15;
    }
    var gap = Math.max(12, Math.min(40, Math.round(Math.min(W, H) * 0.03)));
    var best = { cell: 0, cols: 1 };
    for (var cols = 1; cols <= n; cols++) {
        var rows = Math.ceil(n / cols);
        var cell = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows);
        if (cell > best.cell) best = { cell: cell, cols: cols };
    }
    grid.classList.add('fit');
    grid.style.setProperty('--cols', best.cols);
    grid.style.setProperty('--cell', Math.floor(Math.max(40, Math.min(best.cell, 320))) + 'px');
    grid.style.setProperty('--gap', gap + 'px');
}
