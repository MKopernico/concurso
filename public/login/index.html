<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameShow · Acceso</title>
<style>
:root { --bg: #121217; --surface: #1c1c24; --border: #33333d; --text: #e4e4e7; --text2: #9898a6; --accent: #00d4ff; --danger: #ef4444; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
h1 { font-size: 20px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
p { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px; font-size: 16px; font-family: inherit; }
input:focus { outline: none; border-color: var(--accent); }
button { width: 100%; margin-top: 16px; background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
button:disabled { opacity: .5; cursor: default; }
.error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<form class="card" id="form">
    <h1>GameShow</h1>
    <p>Backoffice y coordinador</p>
    <label for="pw">Contraseña</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">Entrar</button>
    <div class="error" id="err"></div>
</form>
<script>
var params = new URLSearchParams(location.search);
// Solo rutas de esta misma web (se resuelve la URL: '/\\otra.com' o tabuladores no cuelan)
var next = '/admin/';
try {
    var u = new URL(params.get('next') || '/admin/', location.origin);
    if (u.origin === location.origin) next = u.pathname + u.search;
} catch (e) {}

document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('btn');
    var err = document.getElementById('err');
    err.textContent = '';
    btn.disabled = true;
    fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value })
    }).then(function(r) {
        return r.json().then(function(d) { return { ok: r.ok, d: d }; });
    }).then(function(res) {
        if (res.ok) { location.replace(next); return; }
        err.textContent = res.d.error || 'No se pudo entrar';
        btn.disabled = false;
        document.getElementById('pw').select();
    }).catch(function() {
        err.textContent = 'Sin conexión con el servidor';
        btn.disabled = false;
    });
});
</script>
</body>
</html>
